<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITI VALOD Face Camera</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#f4f6f8;
  font-family:Arial,sans-serif;
  text-align:center;
}

h2{
  margin:5px 0 10px;
  color:#222;
}

#modeText{
  margin:5px auto 10px;
  max-width:480px;
  font-weight:bold;
  color:#555;
}

#status{
  margin:10px auto;
  padding:10px;
  max-width:480px;
  border-radius:8px;
  background:#fff;
  border:1px solid #ddd;
  font-size:14px;
}

#videoContainer{
  position:relative;
  width:100%;
  max-width:480px;
  margin:15px auto;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

button{
  width:100%;
  max-width:480px;
  padding:14px;
  margin:8px auto;
  border:none;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#captureBtn{
  background:#1976d2;
  color:#fff;
}

#usePhotoBtn{
  background:#2e7d32;
  color:#fff;
  display:none;
}

#retakeBtn{
  background:#ef6c00;
  color:#fff;
  display:none;
}

#closeBtn{
  background:#666;
  color:#fff;
}

button:disabled{
  background:#aaa !important;
  cursor:not-allowed;
}

.success{
  color:#087f23;
  font-weight:bold;
}

.error{
  color:#c62828;
  font-weight:bold;
}

.info{
  color:#1565c0;
  font-weight:bold;
}

#distanceBox{
  margin:10px auto;
  max-width:480px;
  font-size:14px;
  font-weight:bold;
}

#photoPreview{
  width:100%;
  max-width:480px;
  max-height:420px;
  object-fit:contain;
  border-radius:12px;
  margin:10px auto;
  display:none;
  background:#000;
}
</style>

</head>

<body>

<h2>ITI VALOD Face Camera</h2>

<div id="modeText">Camera Starting...</div>

<div id="status" class="info">
Camera starting...
</div>

<div id="videoContainer">

<video id="video"
      autoplay
      muted
      playsinline></video>

<canvas id="overlay"></canvas>

</div>

<img id="photoPreview"
  alt="Captured Face Photo">

<div id="distanceBox"></div>

<button id="captureBtn" disabled>
📷 Capture Photo
</button>

<button id="usePhotoBtn">
✅ Use Photo
</button>

<button id="retakeBtn">
🔄 Retake Photo
</button>

<button id="closeBtn">
❌ Close Camera
</button>

<script>

/* =========================================================
   ITI VALOD SMART ATTENDANCE
   FINAL FACE CAMERA

   REGISTRATION
   + VERIFICATION
   + ROBUST PARENT CONNECTION
   + CAMERA CLOSE
========================================================= */


/* =========================================================
   CONFIG
========================================================= */

const CAMERA_ORIGIN =
  "https://prashantpatel12th-prog.github.io";

const ALLOWED_PARENT_ORIGINS = [
  "https://script.google.com",
  "https://script.googleusercontent.com"
];


/*
 * 0.55 = reasonably strict.
 */
const FACE_DISTANCE_THRESHOLD = 0.55;


/* =========================================================
   DOM
========================================================= */

const video =
  document.getElementById("video");

const overlay =
  document.getElementById("overlay");

const statusBox =
  document.getElementById("status");

const captureBtn =
  document.getElementById("captureBtn");

const usePhotoBtn =
  document.getElementById("usePhotoBtn");

const retakeBtn =
  document.getElementById("retakeBtn");

const closeBtn =
  document.getElementById("closeBtn");

const distanceBox =
  document.getElementById("distanceBox");

const photoPreview =
  document.getElementById("photoPreview");

const modeText =
  document.getElementById("modeText");

const videoContainer =
  document.getElementById("videoContainer");


/* =========================================================
   STATE
========================================================= */

let parentWindow = null;
let parentOrigin = null;

let selectedTrainee = "";
let selectedTraineeId = "";

let cameraStream = null;

let faceAIReady = false;

let registeredDescriptor = null;
let registeredFaceLoaded = false;

let verificationInProgress = false;

let capturedImageData = "";

let closingCamera = false;


/* =========================================================
   URL PARAMETERS
========================================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );

selectedTrainee =
  urlParams.get("trainee") || "";

selectedTraineeId =
  urlParams.get("traineeId") || "";

const mode =
  (
    urlParams.get("mode") ||
    "verification"
  ).toLowerCase();

const isRegistrationMode =
  mode === "registration";


/* =========================================================
   INITIAL UI
========================================================= */

if(isRegistrationMode){

  modeText.textContent =
    "📷 Face Registration Mode";

  captureBtn.textContent =
    "📷 Capture Photo";

}else{

  modeText.textContent =
    "🔐 Face Verification Mode";

  captureBtn.textContent =
    "🔐 Verify Face";

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message,type){

  statusBox.textContent =
    message;

  statusBox.className = "";

  if(type === "success"){

    statusBox.classList.add("success");

  }else if(type === "error"){

    statusBox.classList.add("error");

  }else{

    statusBox.classList.add("info");

  }

}


/* =========================================================
   PARENT ORIGIN CHECK
========================================================= */

function isAllowedParentOrigin(origin){

  if(!origin){
    return false;
  }

  if(
    ALLOWED_PARENT_ORIGINS.includes(origin)
  ){

    return true;

  }

  try{

    const u =
      new URL(origin);

    if(u.protocol !== "https:"){
      return false;
    }

    const host =
      u.hostname.toLowerCase();

    if(
      host === "script.google.com"
    ){
      return true;
    }

    if(
      host === "googleusercontent.com"
    ){
      return true;
    }

    if(
      host.endsWith(".googleusercontent.com")
    ){
      return true;
    }

    return false;

  }catch(e){

    return false;

  }

}


/* =========================================================
   FIND PARENT WINDOW
========================================================= */

function getParentWindow(){

  if(parentWindow){
    return parentWindow;
  }

  try{

    if(
      window.opener &&
      !window.opener.closed
    ){

      parentWindow =
        window.opener;

      return parentWindow;

    }

  }catch(e){

    console.log(
      "window.opener unavailable"
    );

  }

  return null;

}


/* =========================================================
   SEND MESSAGE TO PARENT
========================================================= */

function sendToParent(message){

  const target =
    getParentWindow();

  if(!target){

    console.error(
      "Parent window not available",
      message.type
    );

    return false;

  }


  /*
   * If exact origin is known,
   * use it.
   */

  if(
    parentOrigin &&
    isAllowedParentOrigin(parentOrigin)
  ){

    try{

      target.postMessage(
        message,
        parentOrigin
      );

      console.log(
        "SENT:",
        message.type,
        parentOrigin
      );

      return true;

    }catch(e){

      console.error(
        "Exact origin send failed",
        e
      );

    }

  }


  /*
   * Try both Apps Script origins.
   */

  let sent = false;

  for(
    const origin of ALLOWED_PARENT_ORIGINS
  ){

    try{

      target.postMessage(
        message,
        origin
      );

      console.log(
        "SENT:",
        message.type,
        origin
      );

      sent = true;

    }catch(e){

      console.log(
        "Send failed:",
        origin,
        e
      );

    }

  }

  return sent;

}


/* =========================================================
   CAMERA CONNECTED
========================================================= */

function sendCameraConnected(){

  sendToParent({

    type:
      "ITI_VALOD_CAMERA_CONNECTED",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    mode:
      mode,

    cameraOrigin:
      CAMERA_ORIGIN

  });

}


/* =========================================================
   CAMERA READY
========================================================= */

function sendCameraReady(){

  if(!faceAIReady){
    return;
  }

  sendToParent({

    type:
      "ITI_VALOD_CAMERA_READY",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    mode:
      mode,

    cameraOrigin:
      CAMERA_ORIGIN

  });


  if(isRegistrationMode){

    captureBtn.disabled =
      false;

    setStatus(
      "Camera ready. Face cameraમાં રાખો અને Capture Photo દબાવો.",
      "success"
    );

  }else{

    if(registeredFaceLoaded){

      captureBtn.disabled =
        false;

      setStatus(
        "Registered face loaded. હવે Verify Face દબાવો.",
        "success"
      );

    }else{

      captureBtn.disabled =
        true;

      setStatus(
        "Registered face loading...",
        "info"
      );

    }

  }

}


/* =========================================================
   REGISTERED FACE READY
========================================================= */

function sendRegisteredFaceReady(){

  sendToParent({

    type:
      "ITI_VALOD_REGISTERED_FACE_READY",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId

  });

}


/* =========================================================
   RECEIVE PARENT MESSAGE
========================================================= */

window.addEventListener(
  "message",
  async function(event){

    try{

      if(
        !isAllowedParentOrigin(
          event.origin
        )
      ){

        console.warn(
          "MESSAGE ORIGIN REJECTED:",
          event.origin
        );

        return;

      }


      /*
       * Remember parent.
       */

      if(event.source){

        parentWindow =
          event.source;

      }

      parentOrigin =
        event.origin;


      console.log(
        "PARENT CONNECTED:",
        parentOrigin
      );


      const data =
        event.data || {};


      /* =====================================================
         CAMERA INIT
      ===================================================== */

      if(
        data.type ===
        "ITI_VALOD_CAMERA_INIT"
      ){

        if(data.trainee){

          selectedTrainee =
            String(data.trainee);

        }

        if(data.traineeId){

          selectedTraineeId =
            String(data.traineeId);

        }


        setStatus(
          isRegistrationMode
            ? "Face Registration connected."
            : "Face Verification connected.",
          "success"
        );


        sendCameraConnected();


        if(faceAIReady){

          sendCameraReady();

        }

        return;

      }


      /* =====================================================
         REGISTERED FACE
      ===================================================== */

      if(
        data.type ===
        "ITI_VALOD_REGISTERED_FACE"
      ){

        if(isRegistrationMode){

          return;

        }


        if(data.trainee){

          selectedTrainee =
            String(data.trainee);

        }

        if(data.traineeId){

          selectedTraineeId =
            String(data.traineeId);

        }


        if(!data.image){

          registeredFaceLoaded =
            false;

          registeredDescriptor =
            null;

          captureBtn.disabled =
            true;

          setStatus(
            "❌ Registered face photo મળ્યો નથી.",
            "error"
          );

          return;

        }


        setStatus(
          "Registered face વાંચી રહ્યા છીએ...",
          "info"
        );


        await processRegisteredFace(
          data.image
        );


        return;

      }


      /* =====================================================
         CLOSE CAMERA REQUEST
      ===================================================== */

      if(
        data.type ===
        "ITI_VALOD_CLOSE_CAMERA"
      ){

        closeCameraWindow();

        return;

      }

    }catch(error){

      console.error(
        "Message error:",
        error
      );

      setStatus(
        "Camera message error.",
        "error"
      );

    }

  }
);


/* =========================================================
   PROCESS REGISTERED FACE
========================================================= */

async function processRegisteredFace(imageData){

  try{

    registeredFaceLoaded =
      false;

    registeredDescriptor =
      null;

    captureBtn.disabled =
      true;


    if(!faceAIReady){

      setStatus(
        "Face model હજુ તૈયાર નથી. થોડી વાર રાહ જુઓ...",
        "info"
      );

      return;

    }


    /*
     * Load image.
     */

    const img =
      await faceapi.fetchImage(
        imageData
      );


    /*
     * Detect registered face.
     */

    const detection =
      await faceapi
        .detectSingleFace(
          img,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.35
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if(!detection){

      setStatus(
        "❌ Registered photoમાં face detect થયો નથી. Face ફરી register કરો.",
        "error"
      );

      return;

    }


    /*
     * Save descriptor.
     */

    registeredDescriptor =
      detection.descriptor;

    registeredFaceLoaded =
      true;


    /*
     * IMPORTANT:
     * Verification button now enabled.
     */

    captureBtn.disabled =
      false;


    setStatus(
      "✅ Registered face ready. હવે Verify Face દબાવો.",
      "success"
    );


    sendRegisteredFaceReady();


  }catch(error){

    console.error(
      "Registered face error:",
      error
    );

    registeredDescriptor =
      null;

    registeredFaceLoaded =
      false;

    captureBtn.disabled =
      true;

    setStatus(
      "❌ Registered face load થઈ શક્યો નથી. ફરી પ્રયાસ કરો.",
      "error"
    );

  }

}


/* =========================================================
   LOAD MODELS
========================================================= */

async function loadModels(){

  try{

    setStatus(
      "Face recognition models loading...",
      "info"
    );


    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";


    await faceapi.nets
      .tinyFaceDetector
      .loadFromUri(
        MODEL_URL
      );


    await faceapi.nets
      .faceLandmark68Net
      .loadFromUri(
        MODEL_URL
      );


    await faceapi.nets
      .faceRecognitionNet
      .loadFromUri(
        MODEL_URL
      );


    faceAIReady =
      true;


    console.log(
      "FACE API READY"
    );


    sendCameraConnected();

    sendCameraReady();


  }catch(error){

    console.error(
      "Model loading error:",
      error
    );

    setStatus(
      "❌ Face model loading failed. Internet connection check કરો.",
      "error"
    );

  }

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

  try{

    setStatus(
      "Camera permission માંગવામાં આવી રહી છે...",
      "info"
    );


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API not supported"
      );

    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:640
          },
          height:{
            ideal:480
          }
        },

        audio:false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    setStatus(
      "Camera active. Face camera તરફ જુઓ.",
      "success"
    );


  }catch(error){

    console.error(
      "Camera error:",
      error
    );


    setStatus(
      "❌ Camera ચાલુ થઈ શક્યો નથી. Camera permission check કરો.",
      "error"
    );

  }

}


/* =========================================================
   REGISTRATION CAPTURE
========================================================= */

async function captureRegistrationPhoto(){

  if(!faceAIReady){

    setStatus(
      "Face recognition તૈયાર નથી.",
      "error"
    );

    return;

  }


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    setStatus(
      "Camera video હજુ તૈયાર નથી.",
      "error"
    );

    return;

  }


  captureBtn.disabled =
    true;


  try{

    setStatus(
      "Face detect થઈ રહ્યો છે...",
      "info"
    );


    const detection =
      await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize:320,
          scoreThreshold:0.35
        })
      );


    if(
      !detection ||
      detection.length === 0
    ){

      setStatus(
        "❌ Face detect થયો નથી. Camera તરફ સીધું જુઓ.",
        "error"
      );

      captureBtn.disabled =
        false;

      return;

    }


    if(detection.length > 1){

      setStatus(
        "❌ એકથી વધુ face detect થયા છે. માત્ર એક trainee cameraમાં હોવો જોઈએ.",
        "error"
      );

      captureBtn.disabled =
        false;

      return;

    }


    capturedImageData =
      createPhoto();


    photoPreview.src =
      capturedImageData;

    photoPreview.style.display =
      "block";

    videoContainer.style.display =
      "none";

    captureBtn.style.display =
      "none";

    usePhotoBtn.style.display =
      "block";

    retakeBtn.style.display =
      "block";


    setStatus(
      "✅ Photo captured. Photo યોગ્ય હોય તો Use Photo દબાવો.",
      "success"
    );


  }catch(error){

    console.error(
      "Registration capture error:",
      error
    );

    setStatus(
      "❌ Photo capture failed. ફરી પ્રયાસ કરો.",
      "error"
    );

    captureBtn.disabled =
      false;

  }

}


/* =========================================================
   CREATE PHOTO
========================================================= */

function createPhoto(){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  /*
   * Mirror photo.
   */

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas.toDataURL(
    "image/jpeg",
    0.90
  );

}


/* =========================================================
   USE PHOTO
========================================================= */

function usePhoto(){

  if(!capturedImageData){

    setStatus(
      "Photo ઉપલબ્ધ નથી.",
      "error"
    );

    return;

  }


  const message = {

    type:
      "ITI_VALOD_FACE_CAPTURE",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    image:
      capturedImageData,

    mode:
      "registration",

    faceVerified:
      false,

    verified:
      false

  };


  const sent =
    sendToParent(
      message
    );


  if(!sent){

    setStatus(
      "❌ Face Registration page સાથે connection નથી.",
      "error"
    );

    return;

  }


  setStatus(
    "✅ Photo Face Registration page પર મોકલી રહ્યા છીએ...",
    "success"
  );


  /*
   * Wait before closing.
   */

  setTimeout(
    function(){

      closeCameraWindow();

    },
    1000
  );

}


/* =========================================================
   RETAKE
========================================================= */

function retakePhoto(){

  capturedImageData =
    "";

  photoPreview.src =
    "";

  photoPreview.style.display =
    "none";

  videoContainer.style.display =
    "block";

  captureBtn.style.display =
    "block";

  usePhotoBtn.style.display =
    "none";

  retakeBtn.style.display =
    "none";

  captureBtn.disabled =
    !faceAIReady;


  setStatus(
    "ફરીથી face cameraમાં રાખો.",
    "info"
  );

}


/* =========================================================
   FACE VERIFICATION
========================================================= */

async function verifyFace(){

  if(verificationInProgress){

    return;

  }


  if(!faceAIReady){

    setStatus(
      "Face recognition તૈયાર નથી.",
      "error"
    );

    return;

  }


  if(
    !registeredFaceLoaded ||
    !registeredDescriptor
  ){

    setStatus(
      "❌ Registered face ready નથી. Registration photo check કરો.",
      "error"
    );

    return;

  }


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    setStatus(
      "Camera video ready નથી.",
      "error"
    );

    return;

  }


  verificationInProgress =
    true;

  captureBtn.disabled =
    true;

  distanceBox.textContent =
    "";


  try{

    setStatus(
      "🔍 Face verify થઈ રહ્યો છે... camera તરફ સીધું જુઓ.",
      "info"
    );


    /*
     * Detect current face.
     */

    const detections =
      await faceapi
        .detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize:320,
            scoreThreshold:0.35
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptors();


    if(
      !detections ||
      detections.length === 0
    ){

      setStatus(
        "❌ Face detect થયો નથી. થોડું નજીક આવીને સીધું camera તરફ જુઓ.",
        "error"
      );

      return;

    }


    if(detections.length > 1){

      setStatus(
        "❌ Multiple faces detected. માત્ર એક trainee cameraમાં હોવો જોઈએ.",
        "error"
      );

      return;

    }


    const face =
      detections[0];


    /*
     * Compare descriptor.
     */

    const distance =
      faceapi.euclideanDistance(
        registeredDescriptor,
        face.descriptor
      );


    distanceBox.textContent =
      "Face distance: " +
      distance.toFixed(3) +
      " | Limit: " +
      FACE_DISTANCE_THRESHOLD;


    console.log(
      "REGISTERED DISTANCE:",
      distance
    );


    const verified =
      distance <=
      FACE_DISTANCE_THRESHOLD;


    /*
     * Create verification photo.
     */

    const imageData =
      createPhoto();


    /* =====================================================
       NOT MATCHED
    ===================================================== */

    if(!verified){

      setStatus(
        "❌ Face does not match registered trainee.",
        "error"
      );


      sendToParent({

        type:
          "ITI_VALOD_FACE_VERIFIED",

        trainee:
          selectedTrainee,

        traineeId:
          selectedTraineeId,

        verified:
          false,

        faceVerified:
          false,

        distance:
          distance

      });


      return;

    }


    /* =====================================================
       VERIFIED
    ===================================================== */

    setStatus(
      "✅ Face verified successfully.",
      "success"
    );


    /*
     * Send attendance photo + verification.
     */

    sendToParent({

      type:
        "ITI_VALOD_FACE_CAPTURE",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      image:
        imageData,

      faceVerified:
        true,

      verified:
        true,

      distance:
        distance,

      mode:
        "verification"

    });


    sendToParent({

      type:
        "ITI_VALOD_FACE_VERIFIED",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      faceVerified:
        true,

      verified:
        true,

      distance:
        distance

    });


    /*
     * Give parent time to receive message,
     * then close camera.
     */

    setTimeout(
      function(){

        closeCameraWindow();

      },
      1200
    );


  }catch(error){

    console.error(
      "Face verification error:",
      error
    );

    setStatus(
      "❌ Face verification failed. ફરી પ્રયાસ કરો.",
      "error"
    );

  }finally{

    verificationInProgress =
      false;


    /*
     * Do not enable button if
     * verification succeeded and
     * camera is closing.
     */

    if(!closingCamera){

      captureBtn.disabled =
        !registeredFaceLoaded;

    }

  }

}


/* =========================================================
   MAIN BUTTON
========================================================= */

captureBtn.addEventListener(
  "click",
  function(){

    if(isRegistrationMode){

      captureRegistrationPhoto();

    }else{

      verifyFace();

    }

  }
);


/* =========================================================
   USE PHOTO BUTTON
========================================================= */

usePhotoBtn.addEventListener(
  "click",
  function(){

    usePhoto();

  }
);


/* =========================================================
   RETAKE BUTTON
========================================================= */

retakeBtn.addEventListener(
  "click",
  function(){

    retakePhoto();

  }
);


/* =========================================================
   CLOSE CAMERA BUTTON
========================================================= */

closeBtn.addEventListener(
  "click",
  function(){

    closeCameraWindow();

  }
);


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

  try{

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          function(track){

            try{

              track.stop();

            }catch(e){}

          }
        );

      cameraStream =
        null;

    }

  }catch(e){

    console.log(
      "Camera stream stop error",
      e
    );

  }


  try{

    video.pause();

  }catch(e){}


  try{

    video.srcObject =
      null;

  }catch(e){}

}


/* =========================================================
   CLOSE CAMERA WINDOW
========================================================= */

function closeCameraWindow(){

  if(closingCamera){

    return;

  }

  closingCamera =
    true;


  /*
   * FIRST:
   * Stop physical camera.
   */

  stopCamera();


  /*
   * Tell parent camera is closing.
   */

  sendToParent({

    type:
      "ITI_VALOD_CAMERA_CLOSED",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    mode:
      mode

  });


  /*
   * Try normal window close.
   */

  setTimeout(
    function(){

      try{

        window.close();

      }catch(e){

        console.log(
          "window.close unavailable"
        );

      }


      /*
       * Second attempt.
       */

      setTimeout(
        function(){

          try{

            if(
              window.opener &&
              !window.opener.closed
            ){

              window.close();

            }

          }catch(e){}

        },
        300
      );

    },
    150
  );

}


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
  "beforeunload",
  function(){

    stopCamera();

  }
);


/* =========================================================
   PAGE HIDE
========================================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
      "hidden"
    ){

      /*
       * Do not stop camera merely because
       * another tab/window temporarily gets focus.
       */

    }

  }
);


/* =========================================================
   VIDEO METADATA
========================================================= */

video.addEventListener(
  "loadedmetadata",
  function(){

    overlay.width =
      video.videoWidth;

    overlay.height =
      video.videoHeight;

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

(async function init(){

  try{

    /*
     * Immediately remember opener.
     */

    try{

      if(
        window.opener &&
        !window.opener.closed
      ){

        parentWindow =
          window.opener;

        console.log(
          "WINDOW.OPENER DETECTED"
        );

      }

    }catch(e){}


    setStatus(
      "ITI VALOD Attendance સાથે connect થઈ રહ્યું છે...",
      "info"
    );


    /*
     * Start camera.
     */

    await startCamera();


    /*
     * Load face models.
     */

    await loadModels();


    /*
     * Final state.
     */

    if(isRegistrationMode){

      captureBtn.disabled =
        false;

      setStatus(
        "✅ Camera ready. Face cameraમાં રાખો અને Capture Photo દબાવો.",
        "success"
      );

    }else{

      if(registeredFaceLoaded){

        captureBtn.disabled =
          false;

        setStatus(
          "✅ Registered face ready. Verify Face દબાવો.",
          "success"
        );

      }else{

        captureBtn.disabled =
          true;

        setStatus(
          "Registered faceની રાહ જોઈ રહ્યા છીએ...",
          "info"
        );

      }

    }

  }catch(error){

    console.error(
      "Initialization error:",
      error
    );

    setStatus(
      "❌ Camera initialization failed.",
      "error"
    );

  }

})();

</script>
