<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ITI VALOD Face Camera</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h2 {
      margin: 5px 0;
      color: #1f2937;
    }

    #modeText {
      font-size: 14px;
      margin: 8px 0 12px;
      font-weight: bold;
    }

    #status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .camera-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #photoPreview {
      width: 100%;
      display: none;
      border-radius: 12px;
      margin-top: 10px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #captureBtn {
      background: #2563eb;
      color: white;
    }

    #usePhotoBtn {
      background: #16a34a;
      color: white;
    }

    #retakeBtn {
      background: #f59e0b;
      color: white;
    }

    #closeBtn {
      background: #dc2626;
      color: white;
    }

    #distanceBox {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    .trainee-info {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 10px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>ITI VALOD</h2>

  <div id="modeText">
    Face Verification
  </div>

  <div class="trainee-info">
    Trainee:
    <span id="traineeName">Loading...</span>
  </div>

  <div id="status" class="info">
    Connecting to ITI VALOD Attendance...
  </div>

  <div class="camera-box">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <img id="photoPreview" alt="Captured Photo">

  <div id="distanceBox"></div>

  <div class="buttons">

    <button id="captureBtn" disabled>
      Verify Face
    </button>

    <button id="usePhotoBtn" style="display:none;">
      Use Photo
    </button>

    <button id="retakeBtn" style="display:none;">
      Retake Photo
    </button>

    <button id="closeBtn">
      Close Camera
    </button>

  </div>

</div>


<script>

  /****************************************************
   * ITI VALOD FACE CAMERA
   * STABLE VERSION
   *
   * Based on previously working verification code.
   *
   * Supports:
   * 1. Registration Mode
   * 2. Verification Mode
   * 3. Registered Face Processing
   * 4. Face Descriptor Matching
   * 5. Parent Window Communication
   ****************************************************/


  /* ==================================================
     CONFIGURATION
     ================================================== */

  const CAMERA_PAGE_ORIGIN =
    "https://prashantpatel12th-prog.github.io";

  const MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";

  const FACE_DISTANCE_THRESHOLD = 0.55;


  /* ==================================================
     DOM
     ================================================== */

  const video =
    document.getElementById("video");

  const overlay =
    document.getElementById("overlay");

  const statusBox =
    document.getElementById("status");

  const captureBtn =
    document.getElementById("captureBtn");

  const usePhotoBtn =
    document.getElementById("usePhotoBtn");

  const retakeBtn =
    document.getElementById("retakeBtn");

  const closeBtn =
    document.getElementById("closeBtn");

  const photoPreview =
    document.getElementById("photoPreview");

  const distanceBox =
    document.getElementById("distanceBox");

  const traineeNameBox =
    document.getElementById("traineeName");

  const modeText =
    document.getElementById("modeText");


  /* ==================================================
     STATE
     ================================================== */

  let parentWindow = null;
  let parentOrigin = null;

  let selectedTrainee = "";
  let selectedTraineeId = "";

  let cameraStream = null;

  let faceAIReady = false;
  let cameraReadySent = false;

  let registeredDescriptor = null;
  let registeredFaceLoaded = false;

  let verificationInProgress = false;

  let capturedImageData = "";

  let isRegistrationMode = false;


  /* ==================================================
     URL PARAMETERS
     ================================================== */

  const urlParams =
    new URLSearchParams(window.location.search);

  selectedTrainee =
    urlParams.get("trainee") || "";

  selectedTraineeId =
    urlParams.get("traineeId") || "";

  const mode =
    (urlParams.get("mode") || "verification")
      .toLowerCase();

  isRegistrationMode =
    mode === "registration";


  traineeNameBox.textContent =
    selectedTrainee || "Unknown";


  if (isRegistrationMode) {

    modeText.textContent =
      "Face Registration";

    captureBtn.textContent =
      "Capture Photo";

  } else {

    modeText.textContent =
      "Face Verification";

    captureBtn.textContent =
      "Verify Face";
  }


  /* ==================================================
     STATUS
     ================================================== */

  function setStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className = "";

    if (type) {
      statusBox.classList.add(type);
    }
  }


  /* ==================================================
     PARENT ORIGIN VALIDATION
     ================================================== */

  function isValidParentOrigin(origin) {

    if (!origin) {
      return false;
    }

    return (
      origin === "https://script.google.com" ||
      origin === "https://script.googleusercontent.com" ||
      origin.endsWith(".googleusercontent.com")
    );
  }


  /* ==================================================
     FIND PARENT WINDOW
     ================================================== */

  function detectParentWindow() {

    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        parentWindow =
          window.opener;

        return true;
      }

    } catch (error) {

      console.warn(
        "window.opener detection failed",
        error
      );
    }

    return false;
  }


  /* ==================================================
     SEND MESSAGE TO ATTENDANCE PAGE
     ================================================== */

  function sendToParent(message) {

    if (
      !parentWindow ||
      !parentOrigin
    ) {
      console.warn(
        "Parent window/origin not ready",
        message
      );

      return false;
    }

    try {

      parentWindow.postMessage(
        message,
        parentOrigin
      );

      console.log(
        "Sent to parent:",
        message
      );

      return true;

    } catch (error) {

      console.error(
        "Parent message error:",
        error
      );

      return false;
    }
  }


  /* ==================================================
     CAMERA CONNECTED
     ================================================== */

  function sendCameraConnected() {

    sendToParent({

      type:
        "ITI_VALOD_CAMERA_CONNECTED",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      mode:
        isRegistrationMode
          ? "registration"
          : "verification"
    });
  }


  /* ==================================================
     CAMERA READY
     ================================================== */

  function sendCameraReady() {

    if (cameraReadySent) {
      return;
    }

    if (!faceAIReady) {
      return;
    }

    cameraReadySent = true;

    sendToParent({

      type:
        "ITI_VALOD_CAMERA_READY",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      mode:
        isRegistrationMode
          ? "registration"
          : "verification"
    });
  }


  /* ==================================================
     REGISTERED FACE READY
     ================================================== */

  function sendRegisteredFaceReady() {

    sendToParent({

      type:
        "ITI_VALOD_REGISTERED_FACE_READY",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      ready: true
    });
  }


  /* ==================================================
     MESSAGE RECEIVER
     ================================================== */

  window.addEventListener(
    "message",
    async function(event) {

      console.log(
        "Message received:",
        event.origin,
        event.data
      );


      /* ----------------------------------------------
         Validate sender
         ---------------------------------------------- */

      if (
        !isValidParentOrigin(event.origin)
      ) {

        console.warn(
          "Rejected message origin:",
          event.origin
        );

        return;
      }


      /* ----------------------------------------------
         Save parent connection
         ---------------------------------------------- */

      parentWindow =
        event.source;

      parentOrigin =
        event.origin;


      /* ----------------------------------------------
         CAMERA INIT
         ---------------------------------------------- */

      if (
        event.data &&
        event.data.type ===
          "ITI_VALOD_CAMERA_INIT"
      ) {

        selectedTrainee =
          event.data.trainee ||
          selectedTrainee;

        selectedTraineeId =
          event.data.traineeId ||
          selectedTraineeId;

        traineeNameBox.textContent =
          selectedTrainee || "Unknown";


        if (
          event.data.mode ===
          "registration"
        ) {

          isRegistrationMode = true;

          modeText.textContent =
            "Face Registration";

          captureBtn.textContent =
            "Capture Photo";

        } else {

          isRegistrationMode = false;

          modeText.textContent =
            "Face Verification";

          captureBtn.textContent =
            "Verify Face";
        }


        sendCameraConnected();

        sendCameraReady();

        return;
      }


      /* ----------------------------------------------
         REGISTERED FACE
         ---------------------------------------------- */

      if (
        event.data &&
        event.data.type ===
          "ITI_VALOD_REGISTERED_FACE"
      ) {

        console.log(
          "Registered Face received"
        );

        if (isRegistrationMode) {

          console.log(
            "Ignoring registered face in registration mode"
          );

          return;
        }


        const imageData =
          event.data.image || "";


        if (!imageData) {

          setStatus(
            "Registered Face image not received.",
            "error"
          );

          return;
        }


        await processRegisteredFace(
          imageData
        );

        return;
      }

    }
  );


  /* ==================================================
     PROCESS REGISTERED FACE
     ================================================== */

  async function processRegisteredFace(
    imageData
  ) {

    try {

      console.log(
        "Registered Face analyze started"
      );


      registeredFaceLoaded =
        false;

      registeredDescriptor =
        null;

      captureBtn.disabled = true;


      setStatus(
        "Registered Face analyze...",
        "info"
      );


      /*
       * IMPORTANT:
       * Use faceapi.fetchImage()
       * because this was working in
       * the previous stable version.
       */

      const img =
        await faceapi.fetchImage(
          imageData
        );


      console.log(
        "Registered image loaded"
      );


      const detection =
        await faceapi
          .detectSingleFace(
            img,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptor();


      console.log(
        "Registered face detection:",
        detection
      );


      if (!detection) {

        registeredFaceLoaded =
          false;

        registeredDescriptor =
          null;

        captureBtn.disabled = true;

        setStatus(
          "Registered face not detected. Please register the face again.",
          "error"
        );

        return;
      }


      /* ----------------------------------------------
         Save descriptor
         ---------------------------------------------- */

      registeredDescriptor =
        detection.descriptor;

      registeredFaceLoaded =
        true;


      /* ----------------------------------------------
         Enable verification
         ---------------------------------------------- */

      captureBtn.disabled = false;


      setStatus(
        "Registered face loaded. Ready for verification.",
        "success"
      );


      distanceBox.textContent =
        "Registered Face: READY";


      console.log(
        "Registered Face READY"
      );


      sendRegisteredFaceReady();

    } catch (error) {

      console.error(
        "Registered face processing error:",
        error
      );


      registeredFaceLoaded =
        false;

      registeredDescriptor =
        null;

      captureBtn.disabled =
        true;


      setStatus(
        "Unable to process registered face.",
        "error"
      );
    }
  }


  /* ==================================================
     LOAD FACE-API MODELS
     ================================================== */

  async function loadModels() {

    setStatus(
      "Loading Face AI models...",
      "info"
    );


    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL
    );


    await faceapi.nets.faceLandmark68Net.loadFromUri(
      MODEL_URL
    );


    await faceapi.nets.faceRecognitionNet.loadFromUri(
      MODEL_URL
    );


    faceAIReady =
      true;


    console.log(
      "Face AI models loaded"
    );


    setStatus(
      "Face AI ready.",
      "success"
    );


    /*
     * Camera may already be connected
     * through window.opener.
     */

    if (
      parentWindow &&
      parentOrigin
    ) {

      sendCameraConnected();

      sendCameraReady();
    }


    /*
     * Registration:
     * Capture button can be enabled
     * immediately.
     */

    if (isRegistrationMode) {

      captureBtn.disabled =
        false;

      setStatus(
        "Camera ready. You can capture the face.",
        "success"
      );

    } else {

      /*
       * Verification:
       * Wait for registered face.
       */

      captureBtn.disabled =
        !registeredFaceLoaded;

      if (!registeredFaceLoaded) {

        setStatus(
          "Waiting for registered face...",
          "warning"
        );
      }
    }
  }


  /* ==================================================
     START CAMERA
     ================================================== */

  async function startCamera() {

    setStatus(
      "Starting camera...",
      "info"
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera API not supported."
      );
    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }
        },

        audio: false
      });


    video.srcObject =
      cameraStream;


    await video.play();


    setStatus(
      "Camera started.",
      "success"
    );


    console.log(
      "Camera started successfully"
    );
  }


  /* ==================================================
     CREATE CAPTURED IMAGE
     ================================================== */

  function createMirroredImage() {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      return "";
    }


    const canvas =
      document.createElement("canvas");


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    return canvas.toDataURL(
      "image/jpeg",
      0.85
    );
  }


  /* ==================================================
     REGISTRATION PHOTO CAPTURE
     ================================================== */

  async function captureRegistrationPhoto() {

    if (!faceAIReady) {

      setStatus(
        "Face AI is not ready.",
        "error"
      );

      return;
    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      setStatus(
        "Camera is not ready.",
        "error"
      );

      return;
    }


    try {

      captureBtn.disabled =
        true;


      setStatus(
        "Checking face...",
        "info"
      );


      const detections =
        await faceapi
          .detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptors();


      if (detections.length === 0) {

        setStatus(
          "No face detected. Please look at the camera.",
          "error"
        );

        captureBtn.disabled =
          false;

        return;
      }


      if (detections.length > 1) {

        setStatus(
          "Multiple faces detected. Only one person should be visible.",
          "error"
        );

        captureBtn.disabled =
          false;

        return;
      }


      capturedImageData =
        createMirroredImage();


      if (!capturedImageData) {

        setStatus(
          "Unable to capture photo.",
          "error"
        );

        captureBtn.disabled =
          false;

        return;
      }


      photoPreview.src =
        capturedImageData;

      photoPreview.style.display =
        "block";


      video.style.display =
        "none";


      captureBtn.style.display =
        "none";


      usePhotoBtn.style.display =
        "block";

      retakeBtn.style.display =
        "block";


      setStatus(
        "Photo captured. Click Use Photo.",
        "success"
      );


    } catch (error) {

      console.error(
        "Registration capture error:",
        error
      );


      setStatus(
        "Unable to capture face.",
        "error"
      );


      captureBtn.disabled =
        false;
    }
  }


  /* ==================================================
     USE REGISTRATION PHOTO
     ================================================== */

  function usePhoto() {

    if (!capturedImageData) {

      setStatus(
        "No photo available.",
        "error"
      );

      return;
    }


    sendToParent({

      type:
        "ITI_VALOD_FACE_CAPTURE",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      image:
        capturedImageData,

      faceVerified:
        false,

      verified:
        false,

      mode:
        "registration"
    });


    setStatus(
      "Photo sent for registration.",
      "success"
    );


    /*
     * Give parent a moment to receive
     * the image before closing.
     */

    setTimeout(
      function() {

        closeCamera();

      },
      700
    );
  }


  /* ==================================================
     RETAKE PHOTO
     ================================================== */

  function retakePhoto() {

    capturedImageData =
      "";


    photoPreview.src =
      "";

    photoPreview.style.display =
      "none";


    video.style.display =
      "block";


    captureBtn.style.display =
      "block";

    captureBtn.disabled =
      false;


    usePhotoBtn.style.display =
      "none";

    retakeBtn.style.display =
      "none";


    setStatus(
      "Camera ready. Capture again.",
      "info"
    );
  }


  /* ==================================================
     VERIFY FACE
     ================================================== */

  async function verifyFace() {

    if (verificationInProgress) {
      return;
    }


    if (!faceAIReady) {

      setStatus(
        "Face AI is not ready.",
        "error"
      );

      return;
    }


    if (!registeredFaceLoaded) {

      setStatus(
        "Registered face is not ready yet.",
        "error"
      );

      return;
    }


    if (!registeredDescriptor) {

      setStatus(
        "Registered face descriptor is missing.",
        "error"
      );

      return;
    }


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      setStatus(
        "Camera is not ready.",
        "error"
      );

      return;
    }


    try {

      verificationInProgress =
        true;

      captureBtn.disabled =
        true;


      distanceBox.textContent =
        "";


      setStatus(
        "Checking your face...",
        "info"
      );


      console.log(
        "Face verification started"
      );


      const detections =
        await faceapi
          .detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptors();


      console.log(
        "Live face detections:",
        detections.length
      );


      /* ----------------------------------------------
         No face
         ---------------------------------------------- */

      if (detections.length === 0) {

        setStatus(
          "Face not found. Please look directly at the camera.",
          "error"
        );


        sendToParent({

          type:
            "ITI_VALOD_FACE_VERIFIED",

          trainee:
            selectedTrainee,

          traineeId:
            selectedTraineeId,

          verified:
            false,

          faceVerified:
            false,

          distance:
            null,

          mode:
            "verification"
        });


        captureBtn.disabled =
          false;

        verificationInProgress =
          false;

        return;
      }


      /* ----------------------------------------------
         Multiple faces
         ---------------------------------------------- */

      if (detections.length > 1) {

        setStatus(
          "Multiple faces detected. Only one person should be visible.",
          "error"
        );


        sendToParent({

          type:
            "ITI_VALOD_FACE_VERIFIED",

          trainee:
            selectedTrainee,

          traineeId:
            selectedTraineeId,

          verified:
            false,

          faceVerified:
            false,

          distance:
            null,

          mode:
            "verification"
        });


        captureBtn.disabled =
          false;

        verificationInProgress =
          false;

        return;
      }


      /* ----------------------------------------------
         Calculate distance
         ---------------------------------------------- */

      const liveFace =
        detections[0];


      const distance =
        faceapi.euclideanDistance(
          registeredDescriptor,
          liveFace.descriptor
        );


      console.log(
        "Face distance:",
        distance
      );


      distanceBox.textContent =
        "Face Distance: " +
        distance.toFixed(3);


      /* ----------------------------------------------
         Face does NOT match
         ---------------------------------------------- */

      if (
        distance >
        FACE_DISTANCE_THRESHOLD
      ) {

        setStatus(
          "Face does not match the registered face.",
          "error"
        );


        sendToParent({

          type:
            "ITI_VALOD_FACE_VERIFIED",

          trainee:
            selectedTrainee,

          traineeId:
            selectedTraineeId,

          verified:
            false,

          faceVerified:
            false,

          distance:
            distance,

          mode:
            "verification"
        });


        captureBtn.disabled =
          false;

        verificationInProgress =
          false;

        return;
      }


      /* ----------------------------------------------
         MATCH SUCCESS
         ---------------------------------------------- */

      setStatus(
        "Face matched successfully.",
        "success"
      );


      capturedImageData =
        createMirroredImage();


      /* ----------------------------------------------
         Send captured image
         ---------------------------------------------- */

      sendToParent({

        type:
          "ITI_VALOD_FACE_CAPTURE",

        trainee:
          selectedTrainee,

        traineeId:
          selectedTraineeId,

        image:
          capturedImageData,

        faceVerified:
          true,

        verified:
          true,

        distance:
          distance,

        mode:
          "verification"
      });


      /* ----------------------------------------------
         Send verification result
         ---------------------------------------------- */

      sendToParent({

        type:
          "ITI_VALOD_FACE_VERIFIED",

        trainee:
          selectedTrainee,

        traineeId:
          selectedTraineeId,

        verified:
          true,

        faceVerified:
          true,

        distance:
          distance,

        mode:
          "verification"
      });


      console.log(
        "FACE VERIFIED SUCCESSFULLY"
      );


      /*
       * Do not close immediately.
       * Parent page gets time to process
       * the verification result.
       */

      setTimeout(
        function() {

          closeCamera();

        },
        1000
      );


    } catch (error) {

      console.error(
        "Face verification error:",
        error
      );


      setStatus(
        "Face verification process error.",
        "error"
      );


      sendToParent({

        type:
          "ITI_VALOD_FACE_VERIFIED",

        trainee:
          selectedTrainee,

        traineeId:
          selectedTraineeId,

        verified:
          false,

        faceVerified:
          false,

        distance:
          null,

        mode:
          "verification"
      });


      captureBtn.disabled =
        false;

    } finally {

      verificationInProgress =
        false;
    }
  }


  /* ==================================================
     CLOSE CAMERA
     ================================================== */

  function closeCamera() {

    try {

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

        cameraStream =
          null;
      }

    } catch (error) {

      console.warn(
        "Camera stop error:",
        error
      );
    }


    try {

      window.close();

    } catch (error) {

      console.warn(
        "Window close error:",
        error
      );
    }
  }


  /* ==================================================
     BUTTON EVENTS
     ================================================== */

  captureBtn.addEventListener(
    "click",
    function() {

      if (isRegistrationMode) {

        captureRegistrationPhoto();

      } else {

        verifyFace();
      }

    }
  );


  usePhotoBtn.addEventListener(
    "click",
    function() {

      usePhoto();

    }
  );


  retakeBtn.addEventListener(
    "click",
    function() {

      retakePhoto();

    }
  );


  closeBtn.addEventListener(
    "click",
    function() {

      closeCamera();

    }
  );


  /* ==================================================
     INITIAL PARENT DETECTION
     ================================================== */

  detectParentWindow();


  /*
   * Try to identify parent origin from referrer.
   */

  try {

    if (
      document.referrer
    ) {

      const referrerUrl =
        new URL(
          document.referrer
        );

      if (
        isValidParentOrigin(
          referrerUrl.origin
        )
      ) {

        parentOrigin =
          referrerUrl.origin;

        console.log(
          "Parent origin detected:",
          parentOrigin
        );
      }
    }

  } catch (error) {

    console.warn(
      "Referrer detection failed:",
      error
    );
  }


  /* ==================================================
     INITIALIZATION
     ================================================== */

  (async function init() {

    try {

      setStatus(
        "Connecting to ITI VALOD Attendance...",
        "info"
      );


      await startCamera();


      await loadModels();


      /*
       * If parent was already detected
       * through window.opener/referrer,
       * send connection information.
       */

      if (
        parentWindow &&
        parentOrigin
      ) {

        sendCameraConnected();

        sendCameraReady();
      }


    } catch (error) {

      console.error(
        "Camera initialization error:",
        error
      );


      setStatus(
        "Camera initialization failed. Please allow camera permission and reload.",
        "error"
      );
    }

  })();

</script>

</body>
</html>
