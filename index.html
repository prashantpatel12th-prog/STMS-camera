<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STMS Camera - Face Verification</title>

  <!-- Face API -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
    }

    video {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      background: #000;
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    img {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      margin-top: 15px;
    }

    button {
      width: 100%;
      max-width: 420px;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #startBtn {
      background: #1976d2;
      color: white;
    }

    #captureBtn {
      background: #2e7d32;
      color: white;
    }

    #retakeBtn {
      background: #ef6c00;
      color: white;
    }

    #useBtn {
      background: #6a1b9a;
      color: white;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.5;
    }

    #faceStatus {
      margin-top: 10px;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      background: #eeeeee;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ITI VALOD</h1>
  <h2>STMS Camera</h2>

  <p id="status">
    Camera શરૂ કરવા માટે નીચેનું button દબાવો.
  </p>

  <div id="faceStatus">
    Face Detection: શરૂ થયું નથી
  </div>

  <video id="video" autoplay playsinline muted></video>

  <canvas id="canvas"></canvas>

  <img id="preview" style="display:none;">

  <button id="startBtn" onclick="startCamera()">
    📷 Open Camera
  </button>

  <button id="captureBtn" onclick="capturePhoto()" style="display:none;">
    📸 Capture Photo
  </button>

  <button id="retakeBtn" onclick="retakePhoto()" style="display:none;">
    🔄 Retake
  </button>

  <button id="useBtn" onclick="usePhoto()" style="display:none;">
    ✅ Use Photo
  </button>

</div>

<script>

let stream = null;
let capturedImage = null;

let modelsLoaded = false;
let faceDetected = false;
let detectionTimer = null;


/* =========================================================
   FACE MODEL LOAD
   ========================================================= */

async function loadFaceModels() {

  const status = document.getElementById("status");
  const faceStatus = document.getElementById("faceStatus");

  try {

    status.innerText =
      "⏳ Face Detection System load થઈ રહ્યું છે...";

    faceStatus.innerText =
      "Face Detection: Loading...";

    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

    modelsLoaded = true;

    faceStatus.innerText =
      "✅ Face Detection Ready";

    faceStatus.style.background = "#e8f5e9";

  } catch (error) {

    console.error("Face model error:", error);

    modelsLoaded = false;

    faceStatus.innerText =
      "❌ Face Detection Model Load Failed";

    faceStatus.style.background = "#ffebee";

    status.innerText =
      "❌ Face Detection શરૂ થઈ શક્યું નથી.";

    throw error;
  }
}


/* =========================================================
   CAMERA START
   ========================================================= */

async function startCamera() {

  const status = document.getElementById("status");
  const video = document.getElementById("video");

  try {

    /*
     * પહેલા Face Detection Model Load
     */

    if (!modelsLoaded) {
      await loadFaceModels();
    }

    status.innerText =
      "Camera permission માંગવામાં આવી રહી છે...";

    stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user",

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }
      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    status.innerText =
      "✅ Camera ચાલુ છે. કૃપા કરીને ચહેરો camera સામે રાખો.";

    document.getElementById("startBtn").style.display = "none";

    document.getElementById("captureBtn").style.display = "block";

    startFaceDetection();

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Camera / Face Detection શરૂ થઈ શક્યું નથી.";

    alert(
      "Camera શરૂ થઈ શક્યો નથી.\n\n" +
      "Browserમાં Camera Permission = Allow કરો.\n\n" +
      "અને Internet connection ચાલુ રાખો."
    );
  }
}


/* =========================================================
   LIVE FACE DETECTION
   ========================================================= */

function startFaceDetection() {

  const video = document.getElementById("video");

  const faceStatus =
    document.getElementById("faceStatus");

  if (detectionTimer) {
    clearInterval(detectionTimer);
  }

  detectionTimer = setInterval(async function() {

    if (!video.videoWidth || !video.videoHeight) {
      return;
    }

    if (!modelsLoaded) {
      return;
    }

    try {

      const detection =
        await faceapi.detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        );

      if (detection) {

        faceDetected = true;

        faceStatus.innerText =
          "✅ Face Detected — Photo લઈ શકાય છે";

        faceStatus.style.background =
          "#e8f5e9";

        faceStatus.style.color =
          "#1b5e20";

      } else {

        faceDetected = false;

        faceStatus.innerText =
          "⚠️ Face દેખાતો નથી — Camera સામે ચહેરો રાખો";

        faceStatus.style.background =
          "#fff3e0";

        faceStatus.style.color =
          "#e65100";
      }

    } catch (error) {

      console.error(
        "Face detection error:",
        error
      );

    }

  }, 700);
}


/* =========================================================
   CAPTURE PHOTO
   ========================================================= */

function capturePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const preview =
    document.getElementById("preview");

  const status =
    document.getElementById("status");

  /*
   * Face હોવું જરૂરી
   */

  if (!faceDetected) {

    alert(
      "ચહેરો detect થયો નથી.\n\n" +
      "કૃપા કરીને camera સામે સીધો ચહેરો રાખીને ફરી પ્રયાસ કરો."
    );

    return;
  }

  if (!video.videoWidth || !video.videoHeight) {

    alert(
      "Camera હજુ તૈયાર નથી. થોડી વાર રાહ જુઓ."
    );

    return;
  }

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const context =
    canvas.getContext("2d");

  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  capturedImage =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  preview.src =
    capturedImage;

  preview.style.display =
    "block";

  video.style.display =
    "none";

  document.getElementById(
    "captureBtn"
  ).style.display = "none";

  document.getElementById(
    "retakeBtn"
  ).style.display = "block";

  document.getElementById(
    "useBtn"
  ).style.display = "block";

  document.getElementById(
    "faceStatus"
  ).innerText =
    "✅ Face Capture Successful";

  document.getElementById(
    "faceStatus"
  ).style.background =
    "#e8f5e9";

  status.innerText =
    "✅ Face Photo Capture થઈ ગયો.";
}


/* =========================================================
   RETAKE PHOTO
   ========================================================= */

function retakePhoto() {

  const video =
    document.getElementById("video");

  const preview =
    document.getElementById("preview");

  const status =
    document.getElementById("status");

  capturedImage = null;

  faceDetected = false;

  preview.src = "";

  preview.style.display =
    "none";

  video.style.display =
    "block";

  document.getElementById(
    "retakeBtn"
  ).style.display = "none";

  document.getElementById(
    "useBtn"
  ).style.display = "none";

  document.getElementById(
    "captureBtn"
  ).style.display = "block";

  document.getElementById(
    "faceStatus"
  ).innerText =
    "Face Detection: ફરી ચેક થઈ રહ્યું છે...";

  document.getElementById(
    "faceStatus"
  ).style.background =
    "#eeeeee";

  status.innerText =
    "ફરીથી camera સામે ચહેરો રાખો.";
}


/* =========================================================
   USE PHOTO
   ========================================================= */

function usePhoto() {

  if (!capturedImage) {

    alert(
      "પહેલા Photo Capture કરો."
    );

    return;
  }

  /*
   * Camera Page Attendance / Registration
   * Page ને photo મોકલે છે.
   */

  if (window.opener) {

    window.opener.postMessage(

      {
        type:
          "ITI_VALOD_FACE_CAPTURE",

        image:
          capturedImage,

        faceDetected:
          true

      },

      "*"

    );

    document.getElementById(
      "status"
    ).innerText =
      "✅ Face Photo Parent Page પર મોકલાઈ રહ્યો છે.";

    setTimeout(function() {

      window.close();

    }, 1000);

  } else {

    /*
     * Standalone testing
     */

    localStorage.setItem(
      "ITI_VALOD_FACE_CAPTURE",
      capturedImage
    );

    document.getElementById(
      "status"
    ).innerText =
      "✅ Face Photo Capture થયો અને Save થયો.";

    alert(
      "Face Detection + Photo Capture સફળ છે.\n\n" +
      "આ Step-1 Test સફળ છે."
    );
  }
}


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (detectionTimer) {

      clearInterval(
        detectionTimer
      );

      detectionTimer = null;
    }

    if (stream) {

      stream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });
    }

  }
);

</script>

</body>
</html>
