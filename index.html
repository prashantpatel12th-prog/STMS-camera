<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STMS Camera</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f2f5f7;
  text-align: center;
}

.box {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
  margin-top: 0;
}

video {
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  background: #000;
  margin-top: 15px;
}

canvas {
  display: none;
}

img {
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  margin-top: 15px;
}

button {
  width: 100%;
  max-width: 420px;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#startBtn {
  background: #1976d2;
  color: white;
}

#captureBtn {
  background: #2e7d32;
  color: white;
}

#retakeBtn {
  background: #ef6c00;
  color: white;
}

#useBtn {
  background: #6a1b9a;
  color: white;
}

#status {
  margin-top: 15px;
  font-weight: bold;
  line-height: 1.5;
}

#faceStatus {
  margin-top: 10px;
  padding: 12px;
  border-radius: 8px;
  background: #f1f1f1;
  font-size: 15px;
  line-height: 1.5;
}

#connectionStatus {
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  background: #fff3cd;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}

.info {
  font-size: 13px;
  color: #555;
  margin-top: 10px;
}

</style>

</head>


<body>

<div class="box">

  <h1>ITI VALOD</h1>

  <h2>STMS Camera</h2>

  <p id="status">
    Face Detection System શરૂ થઈ રહ્યું છે...
  </p>

  <div id="faceStatus">
    ⏳ Face AI Model લોડ થઈ રહ્યું છે...
  </div>

  <div id="connectionStatus">
    🔄 Parent Page સાથે connection તપાસી રહ્યા છીએ...
  </div>

  <video id="video"
         autoplay
         playsinline
         muted>
  </video>

  <canvas id="canvas"></canvas>

  <img id="preview"
       style="display:none;">

  <button id="startBtn"
          onclick="startCamera()"
          disabled>
    📷 Open Camera
  </button>

  <button id="captureBtn"
          onclick="capturePhoto()"
          style="display:none;">
    📸 Capture / Verify Face
  </button>

  <button id="retakeBtn"
          onclick="retakePhoto()"
          style="display:none;">
    🔄 Retake
  </button>

  <button id="useBtn"
          onclick="usePhoto()"
          style="display:none;">
    ✅ Use Photo
  </button>

  <div class="info">
    Attendance modeમાં Registered Face સાથે Match થયા પછી જ Photo સ્વીકારવામાં આવશે.
  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CAMERA_ORIGIN =
  "https://prashantpatel12th-prog.github.io";

const ALLOWED_PARENT_ORIGINS = [
  "https://script.google.com",
  "https://script.googleusercontent.com"
];

const MODEL_URL =
  "https://justadudewhohacks.github.io/face-api.js/models";

const FACE_MATCH_THRESHOLD = 0.55;


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let stream = null;

let capturedImage = null;

let faceModelsLoaded = false;

let registeredFaceData = null;

let registeredDescriptor = null;

let registeredFaceReceived = false;

let faceVerified = false;

let faceVerificationDistance = null;

let parentOrigin = null;


/* =========================================================
   URL PARAMETERS
========================================================= */

const urlParams =
  new URLSearchParams(window.location.search);

const cameraMode =
  urlParams.get("mode") || "registration";

const traineeKey =
  urlParams.get("trainee") || "";


/* =========================================================
   ELEMENTS
========================================================= */

const status =
  document.getElementById("status");

const faceStatus =
  document.getElementById("faceStatus");

const connectionStatus =
  document.getElementById("connectionStatus");

const startBtn =
  document.getElementById("startBtn");

const captureBtn =
  document.getElementById("captureBtn");

const retakeBtn =
  document.getElementById("retakeBtn");

const useBtn =
  document.getElementById("useBtn");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("preview");


/* =========================================================
   FIND PARENT ORIGIN
========================================================= */

function detectParentOrigin() {

  try {

    if (
      document.referrer &&
      document.referrer.startsWith("https://")
    ) {

      const refUrl =
        new URL(document.referrer);

      if (
        ALLOWED_PARENT_ORIGINS.includes(
          refUrl.origin
        )
      ) {

        parentOrigin =
          refUrl.origin;

        return;
      }
    }

  } catch(error) {

    console.log(
      "Referrer origin detection error:",
      error
    );

  }

}


/* =========================================================
   GET PARENT WINDOW
========================================================= */

function getParentWindow() {

  if (window.opener) {
    return window.opener;
  }

  return null;

}


/* =========================================================
   SEND MESSAGE TO PARENT
========================================================= */

function sendToParent(message) {

  const parent =
    getParentWindow();

  if (!parent) {

    connectionStatus.innerText =
      "⚠️ Parent Page સાથે opener connection મળ્યું નથી.";

    return false;
  }


  let targetOrigin =
    parentOrigin;


  if (
    !targetOrigin ||
    !ALLOWED_PARENT_ORIGINS.includes(
      targetOrigin
    )
  ) {

    targetOrigin =
      "https://script.google.com";

  }


  try {

    parent.postMessage(
      message,
      targetOrigin
    );

    console.log(
      "MESSAGE SENT:",
      message,
      "TARGET:",
      targetOrigin
    );

    return true;

  } catch(error) {

    console.error(
      "Primary message error:",
      error
    );

  }


  /*
   * Fallback
   */

  const alternateOrigin =
    targetOrigin ===
    "https://script.google.com"
      ? "https://script.googleusercontent.com"
      : "https://script.google.com";


  try {

    parent.postMessage(
      message,
      alternateOrigin
    );

    console.log(
      "MESSAGE SENT FALLBACK:",
      alternateOrigin
    );

    return true;

  } catch(error) {

    console.error(
      "Fallback message error:",
      error
    );

  }


  return false;

}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
  "load",
  async function() {

    detectParentOrigin();

    if (
      cameraMode ===
      "verification"
    ) {

      status.innerText =
        "🔐 Attendance Face Verification Mode";

      faceStatus.innerText =
        "⏳ Registered Faceની રાહ જોઈ રહ્યા છીએ...";

    } else {

      status.innerText =
        "📸 Face Registration Mode";

      faceStatus.innerText =
        "⏳ Face AI Model લોડ થઈ રહ્યું છે...";

    }


    connectionStatus.innerText =
      "🔄 Parent Attendance Page સાથે connection તપાસી રહ્યા છીએ...";


    /*
     * Parentને તરત connection signal
     */

    sendCameraConnected();


    await loadFaceModels();

  }
);


/* =========================================================
   SEND CAMERA CONNECTED
========================================================= */

function sendCameraConnected() {

  sendToParent({

    type:
      "ITI_VALOD_CAMERA_CONNECTED",

    trainee:
      traineeKey,

    mode:
      cameraMode

  });

}


/* =========================================================
   LOAD FACE API MODELS
========================================================= */

async function loadFaceModels() {

  try {

    faceStatus.innerText =
      "⏳ Face Detection Model લોડ થઈ રહ્યું છે...";


    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL
    );


    faceStatus.innerText =
      "⏳ Face Landmark Model લોડ થઈ રહ્યું છે...";


    await faceapi.nets.faceLandmark68Net.loadFromUri(
      MODEL_URL
    );


    faceStatus.innerText =
      "⏳ Face Recognition Model લોડ થઈ રહ્યું છે...";


    await faceapi.nets.faceRecognitionNet.loadFromUri(
      MODEL_URL
    );


    faceModelsLoaded =
      true;


    faceStatus.innerText =
      "✅ Face AI Ready";


    if (
      cameraMode ===
      "verification"
    ) {

      status.innerText =
        "⏳ Registered Face receive થઈ રહ્યો છે...";

    } else {

      status.innerText =
        "✅ Face AI Ready. હવે Camera Open કરો.";

    }


    /*
     * Camera Ready messages
     */

    sendCameraReady();

    setTimeout(
      sendCameraReady,
      500
    );

    setTimeout(
      sendCameraReady,
      1500
    );

    setTimeout(
      sendCameraReady,
      3000
    );

    setTimeout(
      sendCameraReady,
      5000
    );


  } catch(error) {

    console.error(
      "Face model loading error:",
      error
    );


    faceModelsLoaded =
      false;


    faceStatus.innerText =
      "❌ Face AI Model લોડ થઈ શક્યું નથી.";


    status.innerText =
      "Internet connection ચેક કરો અને ફરી પ્રયાસ કરો.";

  }

}


/* =========================================================
   SEND CAMERA READY
========================================================= */

function sendCameraReady() {

  const sent =
    sendToParent({

      type:
        "ITI_VALOD_CAMERA_READY",

      trainee:
        traineeKey,

      mode:
        cameraMode

    });


  if (sent) {

    connectionStatus.innerText =
      "✅ Attendance Page સાથે Camera connection તૈયાર છે.";

  }

}


/* =========================================================
   RECEIVE MESSAGE FROM PARENT
========================================================= */

window.addEventListener(
  "message",
  async function(event) {

    console.log(
      "MESSAGE RECEIVED:",
      event.origin,
      event.data
    );


    /*
     * Security check
     */

    if (
      !ALLOWED_PARENT_ORIGINS.includes(
        event.origin
      )
    ) {

      console.log(
        "Ignored unknown origin:",
        event.origin
      );

      return;
    }


    /*
     * Save actual parent origin
     */

    parentOrigin =
      event.origin;


    /*
     * Message opener તરફથી જ આવવો જોઈએ
     */

    if (
      window.opener &&
      event.source !== window.opener
    ) {

      console.log(
        "Ignored message: source is not opener"
      );

      return;
    }


    const data =
      event.data;


    if (!data) {
      return;
    }


    console.log(
      "Accepted message:",
      data.type
    );


    /* =====================================================
       CAMERA INIT
    ===================================================== */

    if (
      data.type ===
      "ITI_VALOD_CAMERA_INIT"
    ) {

      connectionStatus.innerText =
        "✅ Attendance Page તરફથી Camera Init મળ્યું.";

      return;

    }


    /* =====================================================
       REGISTERED FACE
    ===================================================== */

    if (
      data.type ===
      "ITI_VALOD_REGISTERED_FACE"
    ) {

      if (
        cameraMode !==
        "verification"
      ) {

        console.log(
          "Registered face ignored in registration mode."
        );

        return;
      }


      connectionStatus.innerText =
        "📥 Registered Face Camera સુધી પહોંચી ગયો.";


      if (!data.image) {

        registeredFaceReceived =
          false;

        registeredDescriptor =
          null;


        faceStatus.innerText =
          "❌ Registered Face image મળ્યો નથી.";

        return;

      }


      /*
       * Save image
       */

      registeredFaceData =
        data.image;

      registeredFaceReceived =
        false;

      registeredDescriptor =
        null;

      faceVerified =
        false;

      faceVerificationDistance =
        null;


      status.innerText =
        "⏳ Registered Face analyze થઈ રહ્યો છે...";

      faceStatus.innerText =
        "🔍 Registered Photoમાં Face શોધી રહ્યા છીએ...";


      /*
       * Face AI હજુ ready ન હોય તો
       */

      if (!faceModelsLoaded) {

        faceStatus.innerText =
          "⏳ Face AI હજુ તૈયાર થઈ રહ્યું છે...";

        return;

      }


      try {

        const descriptor =
          await getFaceDescriptorFromImage(
            registeredFaceData
          );


        if (!descriptor) {

          registeredFaceReceived =
            false;

          registeredDescriptor =
            null;


          faceStatus.innerText =
            "❌ Registered Photoમાં Face મળ્યો નથી.";

          status.innerText =
            "Registered Photo ફરી બનાવવી પડશે.";

          return;

        }


        /*
         * SUCCESS
         */

        registeredDescriptor =
          descriptor;

        registeredFaceReceived =
          true;


        faceStatus.innerText =
          "✅ REGISTERED FACE READY";


        status.innerText =
          "હવે Camera Open કરો.";


        connectionStatus.innerText =
          "✅ Registered Face successfully Cameraમાં તૈયાર છે.";


        /*
         * Open Camera button enable
         */

        startBtn.disabled =
          false;


        /*
         * Parentને confirmation
         */

        sendRegisteredFaceReady();


        console.log(
          "REGISTERED FACE DESCRIPTOR READY"
        );


      } catch(error) {

        console.error(
          "Registered Face processing error:",
          error
        );


        registeredFaceReceived =
          false;

        registeredDescriptor =
          null;


        faceStatus.innerText =
          "❌ Registered Face process થઈ શક્યો નથી.";

        status.innerText =
          "Registered Photo ફરી તપાસો.";

      }

    }

  }
);


/* =========================================================
   REGISTERED FACE READY ACK
========================================================= */

function sendRegisteredFaceReady() {

  sendToParent({

    type:
      "ITI_VALOD_REGISTERED_FACE_READY",

    trainee:
      traineeKey

  });

}


/* =========================================================
   GET FACE DESCRIPTOR
========================================================= */

async function getFaceDescriptorFromImage(
  imageData
) {

  return new Promise(
    function(resolve) {

      const img =
        new Image();


      img.onload =
        async function() {

          try {

            const detection =
              await faceapi
                .detectSingleFace(
                  img,
                  new faceapi.TinyFaceDetectorOptions({
                    inputSize: 320,
                    scoreThreshold: 0.5
                  })
                )
                .withFaceLandmarks()
                .withFaceDescriptor();


            if (!detection) {

              resolve(null);

              return;

            }


            resolve(
              detection.descriptor
            );


          } catch(error) {

            console.error(
              "Descriptor error:",
              error
            );

            resolve(null);

          }

        };


      img.onerror =
        function() {

          resolve(null);

        };


      img.src =
        imageData;

    }
  );

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  if (!faceModelsLoaded) {

    alert(
      "Face AI હજુ તૈયાર નથી.\nથોડી વાર રાહ જુઓ."
    );

    return;

  }


  /*
   * Verification માટે Registered Face ફરજિયાત
   */

  if (
    cameraMode ===
    "verification" &&
    !registeredDescriptor
  ) {

    sendCameraReady();


    alert(
      "Registered Face હજુ તૈયાર નથી.\n\n" +
      "થોડી વાર રાહ જુઓ અને ફરી પ્રયાસ કરો."
    );

    return;

  }


  try {

    status.innerText =
      "📷 Camera permission માંગવામાં આવી રહી છે...";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.innerText =
      "✅ Camera ચાલુ છે.";


    if (
      cameraMode ===
      "verification"
    ) {

      faceStatus.innerText =
        "👤 Registered Face Match માટે Photo લો.";

      connectionStatus.innerText =
        "✅ Registered Face Ready. Verification માટે તૈયાર.";

    } else {

      faceStatus.innerText =
        "👤 Camera સામે એક જ વ્યક્તિનો ચહેરો રાખો.";

      connectionStatus.innerText =
        "✅ Registration Camera Ready.";

    }


    startBtn.style.display =
      "none";


    captureBtn.style.display =
      "block";


    captureBtn.disabled =
      false;


  } catch(error) {

    console.error(
      "Camera error:",
      error
    );


    status.innerText =
      "❌ Camera ચાલુ થઈ શક્યો નથી.";


    alert(
      "Camera ચાલુ થઈ શક્યો નથી.\n\n" +
      "કૃપા કરીને Browserમાં Camera Permission = Allow કરો."
    );

  }

}


/* =========================================================
   CAPTURE PHOTO
========================================================= */

async function capturePhoto() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Camera હજુ તૈયાર નથી.\nથોડી વાર રાહ જુઓ."
    );

    return;

  }


  captureBtn.disabled =
    true;


  status.innerText =
    "⏳ Face તપાસવામાં આવી રહ્યો છે...";


  faceStatus.innerText =
    "🔍 Face Detection ચાલુ છે...";


  try {

    const detections =
      await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      );


    if (
      !detections ||
      detections.length === 0
    ) {

      faceStatus.innerText =
        "❌ Face મળ્યો નથી.";

      status.innerText =
        "Camera સામે તમારો ચહેરો સ્પષ્ટ રાખો.";

      captureBtn.disabled =
        false;

      return;

    }


    if (
      detections.length > 1
    ) {

      faceStatus.innerText =
        "❌ એક કરતાં વધારે Face મળ્યા.";

      status.innerText =
        "Camera સામે માત્ર એક જ વ્યક્તિ હોવી જોઈએ.";

      captureBtn.disabled =
        false;

      return;

    }


    /*
     * Capture Image
     */

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext("2d");


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    capturedImage =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );


    preview.src =
      capturedImage;


    preview.style.display =
      "block";


    video.style.display =
      "none";


    captureBtn.style.display =
      "none";


    retakeBtn.style.display =
      "block";


    /* =====================================================
       REGISTRATION MODE
    ===================================================== */

    if (
      cameraMode ===
      "registration"
    ) {

      faceVerified =
        true;


      faceStatus.innerText =
        "✅ Face Detected";


      status.innerText =
        "✅ Photo Capture થઈ ગયો.";


      useBtn.style.display =
        "block";


      captureBtn.disabled =
        false;


      return;

    }


    /* =====================================================
       VERIFICATION MODE
    ===================================================== */

    if (!registeredDescriptor) {

      faceVerified =
        false;


      faceStatus.innerText =
        "❌ Registered Face હજુ તૈયાર નથી.";


      status.innerText =
        "Registered Face મળ્યા પછી ફરી Capture કરો.";


      useBtn.style.display =
        "none";


      captureBtn.disabled =
        false;


      return;

    }


    /*
     * Live Face Descriptor
     */

    status.innerText =
      "🔐 Registered Face સાથે Match થઈ રહ્યો છે...";


    faceStatus.innerText =
      "⏳ Face Match તપાસી રહ્યા છીએ...";


    const liveDescriptor =
      await getFaceDescriptorFromImage(
        capturedImage
      );


    if (!liveDescriptor) {

      faceVerified =
        false;

      faceVerificationDistance =
        null;


      faceStatus.innerText =
        "❌ Captured Photoમાં Face મળ્યો નથી.";


      status.innerText =
        "ફરીથી Photo Capture કરો.";


      useBtn.style.display =
        "none";


      captureBtn.disabled =
        false;


      return;

    }


    /*
     * Face Distance
     */

    const distance =
      faceapi.euclideanDistance(
        registeredDescriptor,
        liveDescriptor
      );


    faceVerificationDistance =
      Number(
        distance.toFixed(4)
      );


    console.log(
      "FACE DISTANCE:",
      faceVerificationDistance
    );


    /*
     * MATCH
     */

    if (
      distance <=
      FACE_MATCH_THRESHOLD
    ) {

      faceVerified =
        true;


      faceStatus.innerText =
        "✅ FACE MATCH SUCCESS";


      status.innerText =
        "✅ Face Verification સફળ થયું.";


      useBtn.style.display =
        "block";


      sendFaceVerificationResult(
        true,
        faceVerificationDistance
      );


    } else {

      faceVerified =
        false;


      faceStatus.innerText =
        "❌ FACE MATCH FAILED";


      status.innerText =
        "આ Registered Traineeનો Face નથી.";


      useBtn.style.display =
        "none";


      sendFaceVerificationResult(
        false,
        faceVerificationDistance
      );

    }


    captureBtn.disabled =
      false;


  } catch(error) {

    console.error(
      "Capture / verification error:",
      error
    );


    faceVerified =
      false;


    captureBtn.disabled =
      false;


    faceStatus.innerText =
      "❌ Face Verificationમાં error.";


    status.innerText =
      "ફરીથી Photo Capture કરો.";

  }

}


/* =========================================================
   SEND VERIFICATION RESULT
========================================================= */

function sendFaceVerificationResult(
  verified,
  distance
) {

  sendToParent({

    type:
      "ITI_VALOD_FACE_VERIFIED",

    verified:
      verified,

    faceVerified:
      verified,

    distance:
      distance,

    trainee:
      traineeKey

  });

}


/* =========================================================
   RETAKE
========================================================= */

function retakePhoto() {

  capturedImage =
    null;

  faceVerified =
    false;

  faceVerificationDistance =
    null;


  preview.src =
    "";

  preview.style.display =
    "none";


  video.style.display =
    "block";


  retakeBtn.style.display =
    "none";


  useBtn.style.display =
    "none";


  captureBtn.style.display =
    "block";


  captureBtn.disabled =
    false;


  if (
    cameraMode ===
    "verification"
  ) {

    faceStatus.innerText =
      "👤 Registered Face Match માટે ફરી Photo લો.";

    status.innerText =
      "ફરીથી Photo Capture કરો.";

  } else {

    faceStatus.innerText =
      "👤 Face Detection Ready";

    status.innerText =
      "ફરીથી Photo Capture કરો.";

  }

}


/* =========================================================
   USE PHOTO
========================================================= */

function usePhoto() {

  if (!capturedImage) {

    alert(
      "પહેલા Photo Capture કરો."
    );

    return;

  }


  /*
   * Verification modeમાં SUCCESS ફરજિયાત
   */

  if (
    cameraMode ===
    "verification" &&
    faceVerified !== true
  ) {

    alert(
      "❌ Face Verification સફળ નથી.\n\n" +
      "Registered Face સાથે Match થયા પછી જ Photo Use કરી શકાશે."
    );

    return;

  }


  const sent =
    sendToParent({

      type:
        "ITI_VALOD_FACE_CAPTURE",

      image:
        capturedImage,

      faceVerified:
        faceVerified,

      verified:
        faceVerified,

      distance:
        faceVerificationDistance,

      trainee:
        traineeKey

    });


  if (sent) {

    status.innerText =
      "✅ Photo Parent Page પર મોકલાઈ રહ્યો છે.";


    /*
     * Camera બંધ
     */

    stopCamera();


    /*
     * Parentને message પહોંચવા થોડો સમય
     */

    setTimeout(
      function() {

        try {

          window.close();

        } catch(error) {

          console.log(
            "Window close error:",
            error
          );

        }

      },
      1200
    );

  } else {

    alert(
      "❌ Parent Attendance Page સાથે connection નથી."
    );

  }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream =
    null;


  video.srcObject =
    null;

}


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>

</html>
