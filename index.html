<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ITI VALOD Face Camera</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 5px 0 10px;
      color: #222;
    }

    #status {
      margin: 10px auto;
      padding: 10px;
      max-width: 480px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button {
      width: 100%;
      max-width: 480px;
      padding: 14px;
      margin: 8px auto;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #captureBtn {
      background: #1976d2;
      color: white;
    }

    #closeBtn {
      background: #666;
      color: white;
    }

    button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    .success {
      color: #087f23;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

    #distanceBox {
      margin: 10px auto;
      max-width: 480px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>ITI VALOD Face Verification</h2>

  <div id="status" class="info">
    Camera starting...
  </div>

  <div id="videoContainer">
    <video id="video"
           autoplay
           muted
           playsinline></video>

    <canvas id="overlay"></canvas>
  </div>

  <div id="distanceBox"></div>

  <button id="captureBtn" disabled>
    Verify Face
  </button>

  <button id="closeBtn">
    Close Camera
  </button>


<script>

/* =========================================================
   ITI VALOD SMART ATTENDANCE
   COMPLETE CAMERA HTML
   UPDATED GOOGLE APPS SCRIPT ORIGIN HANDLING
   ========================================================= */


/* ---------------------------------------------------------
   BASIC CONFIGURATION
--------------------------------------------------------- */

const CAMERA_ORIGIN =
  "https://prashantpatel12th-prog.github.io";


const ALLOWED_FIXED_PARENT_ORIGINS = [
  "https://script.google.com",
  "https://script.googleusercontent.com"
];


/* ---------------------------------------------------------
   DOM
--------------------------------------------------------- */

const video =
  document.getElementById("video");

const overlay =
  document.getElementById("overlay");

const statusBox =
  document.getElementById("status");

const captureBtn =
  document.getElementById("captureBtn");

const closeBtn =
  document.getElementById("closeBtn");

const distanceBox =
  document.getElementById("distanceBox");


/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */

let parentWindow = null;

let parentOrigin = null;

let selectedTrainee = "";

let cameraStream = null;

let faceAIReady = false;

let cameraReadySent = false;

let registeredDescriptor = null;

let registeredFaceLoaded = false;

let verificationInProgress = false;

let lastDetection = null;


/* Face matching threshold
   Lower = stricter
   0.55 is a reasonable starting value
--------------------------------------------------------- */

const FACE_DISTANCE_THRESHOLD = 0.55;


/* ---------------------------------------------------------
   READ URL PARAMETERS
--------------------------------------------------------- */

const urlParams =
  new URLSearchParams(window.location.search);

selectedTrainee =
  urlParams.get("trainee") || "";

const mode =
  urlParams.get("mode") || "verify";


/* ---------------------------------------------------------
   STATUS FUNCTION
--------------------------------------------------------- */

function setStatus(message, type) {

  statusBox.textContent = message;

  statusBox.className = "";

  if (type === "success") {
    statusBox.classList.add("success");
  }
  else if (type === "error") {
    statusBox.classList.add("error");
  }
  else {
    statusBox.classList.add("info");
  }
}


/* ---------------------------------------------------------
   GOOGLE APPS SCRIPT ORIGIN VALIDATION
---------------------------------------------------------

   IMPORTANT:

   Apps Script can open the Web App using a dynamic
   googleusercontent.com hostname.

   Example:

   https://n-q5m7wejmqsinlbtpscde4fvmr6jayv5btlqjvq-0lu-script.googleusercontent.com

   Therefore exact origin matching is NOT enough.

--------------------------------------------------------- */

function isAllowedParentOrigin(origin) {

  if (!origin) {
    return false;
  }

  if (ALLOWED_FIXED_PARENT_ORIGINS.includes(origin)) {
    return true;
  }

  try {

    const url = new URL(origin);

    if (url.protocol !== "https:") {
      return false;
    }

    const hostname =
      url.hostname.toLowerCase();


    /*
      Allow:

      script.google.com

      script.googleusercontent.com

      any secure *.googleusercontent.com
    */

    if (hostname === "script.google.com") {
      return true;
    }

    if (hostname === "googleusercontent.com") {
      return true;
    }

    if (hostname.endsWith(".googleusercontent.com")) {
      return true;
    }

    return false;

  }
  catch (error) {

    return false;
  }
}


/* ---------------------------------------------------------
   SEND MESSAGE TO PARENT
--------------------------------------------------------- */

function sendToParent(message) {

  if (!parentWindow || !parentOrigin) {
    return false;
  }

  if (!isAllowedParentOrigin(parentOrigin)) {
    console.error(
      "Blocked parent origin:",
      parentOrigin
    );

    return false;
  }

  try {

    parentWindow.postMessage(
      message,
      parentOrigin
    );

    return true;

  }
  catch (error) {

    console.error(
      "postMessage failed:",
      error
    );

    return false;
  }
}


/* ---------------------------------------------------------
   SEND CAMERA CONNECTED
--------------------------------------------------------- */

function sendCameraConnected() {

  sendToParent({
    type: "ITI_VALOD_CAMERA_CONNECTED",
    trainee: selectedTrainee,
    cameraOrigin: CAMERA_ORIGIN
  });
}


/* ---------------------------------------------------------
   SEND CAMERA READY
--------------------------------------------------------- */

function sendCameraReady() {

  if (!parentWindow || !parentOrigin) {
    return;
  }

  if (!faceAIReady) {
    return;
  }

  sendToParent({
    type: "ITI_VALOD_CAMERA_READY",
    trainee: selectedTrainee,
    cameraOrigin: CAMERA_ORIGIN
  });

  cameraReadySent = true;
}


/* ---------------------------------------------------------
   SEND REGISTERED FACE READY
--------------------------------------------------------- */

function sendRegisteredFaceReady() {

  sendToParent({
    type: "ITI_VALOD_REGISTERED_FACE_READY",
    trainee: selectedTrainee
  });
}


/* ---------------------------------------------------------
   RECEIVE MESSAGE FROM ATTENDANCE PAGE
--------------------------------------------------------- */

window.addEventListener(
  "message",
  async function(event) {

    try {

      /* -----------------------------------------------
         SECURITY CHECK
      ------------------------------------------------ */

      if (!isAllowedParentOrigin(event.origin)) {

        console.warn(
          "MESSAGE ORIGIN REJECTED",
          event.origin
        );

        setStatus(
          "Message Origin Rejected: " +
          event.origin,
          "error"
        );

        return;
      }


      /* -----------------------------------------------
         SAVE PARENT WINDOW + ORIGIN
      ------------------------------------------------ */

      parentWindow =
        event.source;

      parentOrigin =
        event.origin;


      console.log(
        "Parent connected:",
        parentOrigin
      );


      /* -----------------------------------------------
         CAMERA INIT / HANDSHAKE
      ------------------------------------------------ */

      if (
        event.data &&
        event.data.type ===
        "ITI_VALOD_CAMERA_INIT"
      ) {

        if (event.data.trainee) {

          selectedTrainee =
            String(event.data.trainee);

        }


        setStatus(
          "Attendance page connected.",
          "success"
        );


        sendCameraConnected();


        if (faceAIReady) {
          sendCameraReady();
        }


        return;
      }


      /* -----------------------------------------------
         REGISTERED FACE
      ------------------------------------------------ */

      if (
        event.data &&
        event.data.type ===
        "ITI_VALOD_REGISTERED_FACE"
      ) {

        if (event.data.trainee) {

          selectedTrainee =
            String(event.data.trainee);

        }


        const imageData =
          event.data.image;


        if (!imageData) {

          setStatus(
            "Registered face image not received.",
            "error"
          );

          return;
        }


        setStatus(
          "Loading registered face...",
          "info"
        );


        await processRegisteredFace(
          imageData
        );


        return;
      }

    }
    catch (error) {

      console.error(
        "Message handling error:",
        error
      );

      setStatus(
        "Camera message error: " +
        error.message,
        "error"
      );
    }

  }
);


/* ---------------------------------------------------------
   PROCESS REGISTERED FACE
--------------------------------------------------------- */

async function processRegisteredFace(
  imageData
) {

  try {

    registeredFaceLoaded = false;

    registeredDescriptor = null;


    const img =
      await faceapi.fetchImage(
        imageData
      );


    const detection =
      await faceapi
        .detectSingleFace(
          img,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();


    if (!detection) {

      setStatus(
        "Registered face not detected. Please register the face again.",
        "error"
      );

      return;
    }


    registeredDescriptor =
      detection.descriptor;


    registeredFaceLoaded = true;


    setStatus(
      "Registered face loaded. Ready for verification.",
      "success"
    );


    captureBtn.disabled = false;


    sendRegisteredFaceReady();

  }
  catch (error) {

    console.error(
      "Registered face processing error:",
      error
    );

    setStatus(
      "Unable to process registered face.",
      "error"
    );
  }
}


/* ---------------------------------------------------------
   LOAD FACE API MODELS
--------------------------------------------------------- */

async function loadModels() {

  try {

    setStatus(
      "Loading face recognition models...",
      "info"
    );


    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";


    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL
    );


    await faceapi.nets.faceLandmark68Net.loadFromUri(
      MODEL_URL
    );


    await faceapi.nets.faceRecognitionNet.loadFromUri(
      MODEL_URL
    );


    faceAIReady = true;


    setStatus(
      "Face recognition ready.",
      "success"
    );


    if (parentWindow && parentOrigin) {

      sendCameraConnected();

      sendCameraReady();
    }

  }
  catch (error) {

    console.error(
      "Model loading error:",
      error
    );

    setStatus(
      "Face model loading failed. Please refresh.",
      "error"
    );
  }
}


/* ---------------------------------------------------------
   START CAMERA
--------------------------------------------------------- */

async function startCamera() {

  try {

    setStatus(
      "Requesting camera permission...",
      "info"
    );


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    setStatus(
      "Camera active. Position your face clearly.",
      "success"
    );

  }
  catch (error) {

    console.error(
      "Camera error:",
      error
    );

    setStatus(
      "Camera permission denied or camera unavailable.",
      "error"
    );
  }
}


/* ---------------------------------------------------------
   CAPTURE / VERIFY FACE
--------------------------------------------------------- */

captureBtn.addEventListener(
  "click",
  async function() {

    if (verificationInProgress) {
      return;
    }


    if (!faceAIReady) {

      setStatus(
        "Face recognition is not ready.",
        "error"
      );

      return;
    }


    if (!registeredFaceLoaded ||
        !registeredDescriptor) {

      setStatus(
        "Registered face is not ready.",
        "error"
      );

      return;
    }


    if (!video.videoWidth ||
        !video.videoHeight) {

      setStatus(
        "Camera video is not ready.",
        "error"
      );

      return;
    }


    verificationInProgress = true;

    captureBtn.disabled = true;


    try {

      setStatus(
        "Detecting face...",
        "info"
      );


      const detection =
        await faceapi
          .detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptors();


      /* -----------------------------------------------
         NO FACE
      ------------------------------------------------ */

      if (!detection ||
          detection.length === 0) {

        setStatus(
          "Face not detected. Look directly at camera.",
          "error"
        );

        return;
      }


      /* -----------------------------------------------
         MULTIPLE FACES
      ------------------------------------------------ */

      if (detection.length > 1) {

        setStatus(
          "Multiple faces detected. Only one trainee should be visible.",
          "error"
        );

        return;
      }


      const face =
        detection[0];


      /* -----------------------------------------------
         FACE DISTANCE
      ------------------------------------------------ */

      const distance =
        faceapi.euclideanDistance(
          registeredDescriptor,
          face.descriptor
        );


      distanceBox.textContent =
        "Face distance: " +
        distance.toFixed(3);


      console.log(
        "Face distance:",
        distance
      );


      const verified =
        distance <= FACE_DISTANCE_THRESHOLD;


      /* -----------------------------------------------
         CREATE IMAGE
      ------------------------------------------------ */

      const canvas =
        document.createElement("canvas");

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      const ctx =
        canvas.getContext("2d");


      /*
        Mirror image so captured photo looks natural.
      */

      ctx.translate(
        canvas.width,
        0
      );

      ctx.scale(
        -1,
        1
      );


      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      const imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.85
        );


      /* -----------------------------------------------
         FACE NOT MATCHED
      ------------------------------------------------ */

      if (!verified) {

        setStatus(
          "Face does not match registered trainee.",
          "error"
        );


        sendToParent({

          type:
            "ITI_VALOD_FACE_VERIFIED",

          trainee:
            selectedTrainee,

          verified:
            false,

          faceVerified:
            false,

          distance:
            distance

        });


        return;
      }


      /* -----------------------------------------------
         FACE VERIFIED
      ------------------------------------------------ */

      setStatus(
        "Face verified successfully.",
        "success"
      );


      /*
        Send capture message.
      */

      sendToParent({

        type:
          "ITI_VALOD_FACE_CAPTURE",

        trainee:
          selectedTrainee,

        image:
          imageData,

        faceVerified:
          true,

        verified:
          true,

        distance:
          distance

      });


      /*
        Also send dedicated verification message.
      */

      sendToParent({

        type:
          "ITI_VALOD_FACE_VERIFIED",

        trainee:
          selectedTrainee,

        faceVerified:
          true,

        verified:
          true,

        distance:
          distance

      });

    }
    catch (error) {

      console.error(
        "Face verification error:",
        error
      );

      setStatus(
        "Face verification failed. Please try again.",
        "error"
      );

    }
    finally {

      verificationInProgress =
        false;

      captureBtn.disabled =
        !registeredFaceLoaded;
    }

  }
);


/* ---------------------------------------------------------
   CLOSE CAMERA
--------------------------------------------------------- */

closeBtn.addEventListener(
  "click",
  function() {

    stopCamera();

    try {

      if (window.opener) {
        window.close();
      }

    }
    catch (error) {

      console.log(
        "Window close unavailable."
      );
    }

  }
);


/* ---------------------------------------------------------
   STOP CAMERA
--------------------------------------------------------- */

function stopCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    cameraStream = null;
  }


  video.srcObject = null;
}


/* ---------------------------------------------------------
   PAGE CLOSE
--------------------------------------------------------- */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* ---------------------------------------------------------
   VIDEO READY
--------------------------------------------------------- */

video.addEventListener(
  "loadedmetadata",
  function() {

    overlay.width =
      video.videoWidth;

    overlay.height =
      video.videoHeight;

  }
);


/* ---------------------------------------------------------
   START EVERYTHING
--------------------------------------------------------- */

(async function init() {

  try {

    setStatus(
      "Connecting to ITI VALOD Attendance...",
      "info"
    );


    await startCamera();


    await loadModels();

  }
  catch (error) {

    console.error(
      "Camera initialization error:",
      error
    );

    setStatus(
      "Camera initialization failed.",
      "error"
    );
  }

})();


</script>

</body>
</html>
