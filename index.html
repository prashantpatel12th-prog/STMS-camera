<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ITI VALOD Face Camera</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 5px 0 10px;
      color: #222;
    }

    #modeText {
      margin: 5px auto 10px;
      max-width: 480px;
      font-weight: bold;
      color: #555;
    }

    #status {
      margin: 10px auto;
      padding: 10px;
      max-width: 480px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 15px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    button {
      width: 100%;
      max-width: 480px;
      padding: 14px;
      margin: 8px auto;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #captureBtn {
      background: #1976d2;
      color: white;
    }

    #usePhotoBtn {
      background: #2e7d32;
      color: white;
      display: none;
    }

    #retakeBtn {
      background: #ef6c00;
      color: white;
      display: none;
    }

    #closeBtn {
      background: #666;
      color: white;
    }

    button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    .success {
      color: #087f23;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .info {
      color: #1565c0;
      font-weight: bold;
    }

    #distanceBox {
      margin: 10px auto;
      max-width: 480px;
      font-size: 14px;
    }

    #photoPreview {
      width: 100%;
      max-width: 480px;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      margin: 10px auto;
      display: none;
      background: #000;
    }

  </style>

</head>

<body>

  <h2>ITI VALOD Face Camera</h2>

  <div id="modeText">
    Camera Starting...
  </div>

  <div id="status" class="info">
    Camera starting...
  </div>

  <div id="videoContainer">

    <video id="video"
           autoplay
           muted
           playsinline></video>

    <canvas id="overlay"></canvas>

  </div>

  <img id="photoPreview"
       alt="Captured Face Photo">


  <div id="distanceBox"></div>


  <!-- MAIN BUTTON -->

  <button id="captureBtn"
          disabled>
    📷 Capture Photo
  </button>


  <!-- REGISTRATION ONLY -->

  <button id="usePhotoBtn">
    ✅ Use Photo
  </button>


  <button id="retakeBtn">
    🔄 Retake Photo
  </button>


  <!-- CLOSE -->

  <button id="closeBtn">
    Close Camera
  </button>


<script>


/* =========================================================
   ITI VALOD SMART ATTENDANCE
   COMPLETE FACE CAMERA
   REGISTRATION + VERIFICATION

   IMPORTANT:
   Registration:
   Capture Photo
       ↓
   Use Photo
       ↓
   Face Registration Page

   This version uses BOTH:
   1. parentWindow from postMessage
   2. window.opener fallback
========================================================= */


/* =========================================================
   BASIC CONFIGURATION
========================================================= */

const CAMERA_ORIGIN =
  "https://prashantpatel12th-prog.github.io";


const ALLOWED_FIXED_PARENT_ORIGINS = [

  "https://script.google.com",

  "https://script.googleusercontent.com"

];


/* =========================================================
   DOM
========================================================= */

const video =
  document.getElementById("video");


const overlay =
  document.getElementById("overlay");


const statusBox =
  document.getElementById("status");


const captureBtn =
  document.getElementById("captureBtn");


const usePhotoBtn =
  document.getElementById("usePhotoBtn");


const retakeBtn =
  document.getElementById("retakeBtn");


const closeBtn =
  document.getElementById("closeBtn");


const distanceBox =
  document.getElementById("distanceBox");


const photoPreview =
  document.getElementById("photoPreview");


const modeText =
  document.getElementById("modeText");


const videoContainer =
  document.getElementById("videoContainer");


/* =========================================================
   STATE
========================================================= */

let parentWindow = null;

let parentOrigin = null;

let selectedTrainee = "";

let selectedTraineeId = "";

let cameraStream = null;

let faceAIReady = false;

let cameraReadySent = false;

let registeredDescriptor = null;

let registeredFaceLoaded = false;

let verificationInProgress = false;

let capturedImageData = "";


/* =========================================================
   FACE MATCHING THRESHOLD
========================================================= */

const FACE_DISTANCE_THRESHOLD = 0.55;


/* =========================================================
   READ URL PARAMETERS
========================================================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


selectedTrainee =
  urlParams.get("trainee") || "";


selectedTraineeId =
  urlParams.get("traineeId") || "";


const mode =
  (
    urlParams.get("mode") ||
    "verification"
  ).toLowerCase();


/* =========================================================
   DETERMINE MODE
========================================================= */

const isRegistrationMode =
  mode === "registration";


/* =========================================================
   INITIAL UI
========================================================= */

if (isRegistrationMode) {

  modeText.textContent =
    "📷 Face Registration Mode";

  captureBtn.textContent =
    "📷 Capture Photo";

}
else {

  modeText.textContent =
    "🔐 Face Verification Mode";

  captureBtn.textContent =
    "🔐 Verify Face";

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type
) {

  statusBox.textContent =
    message;


  statusBox.className = "";


  if (type === "success") {

    statusBox.classList.add(
      "success"
    );

  }
  else if (type === "error") {

    statusBox.classList.add(
      "error"
    );

  }
  else {

    statusBox.classList.add(
      "info"
    );

  }

}


/* =========================================================
   PARENT ORIGIN VALIDATION
========================================================= */

function isAllowedParentOrigin(
  origin
) {

  if (!origin) {
    return false;
  }


  if (
    ALLOWED_FIXED_PARENT_ORIGINS
      .includes(origin)
  ) {

    return true;

  }


  try {

    const url =
      new URL(origin);


    if (
      url.protocol !==
      "https:"
    ) {

      return false;

    }


    const hostname =
      url.hostname.toLowerCase();


    if (
      hostname ===
      "script.google.com"
    ) {

      return true;

    }


    if (
      hostname ===
      "googleusercontent.com"
    ) {

      return true;

    }


    if (
      hostname.endsWith(
        ".googleusercontent.com"
      )
    ) {

      return true;

    }


    return false;

  }
  catch (error) {

    return false;

  }

}


/* =========================================================
   GET PARENT WINDOW
========================================================= */

function getBestParentWindow() {

  /*
   * First preference:
   * parentWindow received through postMessage
   */

  if (parentWindow) {

    return parentWindow;

  }


  /*
   * Second preference:
   * window.opener
   */

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      return window.opener;

    }

  }
  catch (error) {

    console.log(
      "window.opener unavailable"
    );

  }


  return null;

}


/* =========================================================
   GET PARENT ORIGIN
========================================================= */

function getBestParentOrigin() {

  /*
   * If parent origin already known,
   * use it.
   */

  if (
    parentOrigin &&
    isAllowedParentOrigin(
      parentOrigin
    )
  ) {

    return parentOrigin;

  }


  /*
   * Apps Script parent is normally
   * script.google.com or googleusercontent.
   *
   * Because targetOrigin cannot be wildcard
   * for secure communication, try the known
   * Apps Script origins.
   */

  return null;

}


/* =========================================================
   SEND MESSAGE TO PARENT
========================================================= */

function sendToParent(
  message
) {

  const targetWindow =
    getBestParentWindow();


  /*
   * If INIT handshake has already provided
   * exact parent origin, use it.
   */

  let targetOrigin =
    getBestParentOrigin();


  /*
   * If parent origin is not known,
   * try Apps Script known origins.
   */

  if (
    !targetWindow
  ) {

    console.error(
      "Parent window not available."
    );

    return false;

  }


  if (
    !targetOrigin
  ) {

    /*
     * Try Google Apps Script origins.
     *
     * First send to script.google.com.
     */

    try {

      targetWindow.postMessage(
        message,
        "https://script.google.com"
      );

      console.log(
        "Message sent using script.google.com:",
        message.type
      );

    }
    catch (error) {

      console.error(
        "postMessage failed:",
        error
      );

      return false;

    }


    /*
     * Also try script.googleusercontent.com.
     */

    try {

      targetWindow.postMessage(
        message,
        "https://script.googleusercontent.com"
      );

      console.log(
        "Message sent using script.googleusercontent.com:",
        message.type
      );

    }
    catch (error) {

      console.log(
        "Second parent origin failed:",
        error
      );

    }


    return true;

  }


  /*
   * Exact known parent origin.
   */

  if (
    !isAllowedParentOrigin(
      targetOrigin
    )
  ) {

    console.error(
      "Blocked parent origin:",
      targetOrigin
    );

    return false;

  }


  try {

    targetWindow.postMessage(
      message,
      targetOrigin
    );


    console.log(
      "Message sent to parent:",
      message.type,
      "Origin:",
      targetOrigin
    );


    return true;

  }
  catch (error) {

    console.error(
      "postMessage failed:",
      error
    );


    return false;

  }

}


/* =========================================================
   CAMERA CONNECTED
========================================================= */

function sendCameraConnected() {

  sendToParent({

    type:
      "ITI_VALOD_CAMERA_CONNECTED",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    mode:
      mode,

    cameraOrigin:
      CAMERA_ORIGIN

  });

}


/* =========================================================
   CAMERA READY
========================================================= */

function sendCameraReady() {

  if (!faceAIReady) {

    return;

  }


  sendToParent({

    type:
      "ITI_VALOD_CAMERA_READY",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    mode:
      mode,

    cameraOrigin:
      CAMERA_ORIGIN

  });


  cameraReadySent =
    true;


  if (isRegistrationMode) {

    captureBtn.disabled =
      false;


    setStatus(
      "Camera ready. Face cameraમાં રાખો અને Capture Photo દબાવો.",
      "success"
    );

  }

}


/* =========================================================
   REGISTERED FACE READY
========================================================= */

function sendRegisteredFaceReady() {

  sendToParent({

    type:
      "ITI_VALOD_REGISTERED_FACE_READY",

    trainee:
      selectedTrainee

  });

}


/* =========================================================
   RECEIVE MESSAGE FROM PARENT
========================================================= */

window.addEventListener(
  "message",
  async function(event) {

    try {

      /*
       * SECURITY
       */

      if (
        !isAllowedParentOrigin(
          event.origin
        )
      ) {

        console.warn(
          "MESSAGE ORIGIN REJECTED:",
          event.origin
        );

        return;

      }


      /*
       * Save parent connection.
       */

      if (event.source) {

        parentWindow =
          event.source;

      }


      parentOrigin =
        event.origin;


      console.log(
        "Parent connected:",
        parentOrigin
      );


      const data =
        event.data || {};


      /* =====================================================
         CAMERA INIT
      ===================================================== */

      if (
        data.type ===
        "ITI_VALOD_CAMERA_INIT"
      ) {

        if (data.trainee) {

          selectedTrainee =
            String(
              data.trainee
            );

        }


        if (data.traineeId) {

          selectedTraineeId =
            String(
              data.traineeId
            );

        }


        setStatus(
          isRegistrationMode
            ? "Face Registration connected."
            : "Face Verification connected.",
          "success"
        );


        sendCameraConnected();


        if (faceAIReady) {

          sendCameraReady();

        }


        return;

      }


      /* =====================================================
         REGISTERED FACE
      ===================================================== */

      if (
        data.type ===
        "ITI_VALOD_REGISTERED_FACE"
      ) {

        if (isRegistrationMode) {

          console.log(
            "Registration mode: registered face ignored."
          );

          return;

        }


        if (data.trainee) {

          selectedTrainee =
            String(
              data.trainee
            );

        }


        const imageData =
          data.image;


        if (!imageData) {

          setStatus(
            "Registered face image not received.",
            "error"
          );

          return;

        }


        setStatus(
          "Loading registered face...",
          "info"
        );


        await processRegisteredFace(
          imageData
        );


        return;

      }

    }
    catch (error) {

      console.error(
        "Message handling error:",
        error
      );


      setStatus(
        "Camera message error: " +
        error.message,
        "error"
      );

    }

  }
);


/* =========================================================
   PROCESS REGISTERED FACE
========================================================= */

async function processRegisteredFace(
  imageData
) {

  try {

    registeredFaceLoaded =
      false;


    registeredDescriptor =
      null;


    const img =
      await faceapi.fetchImage(
        imageData
      );


    const detection =
      await faceapi

        .detectSingleFace(

          img,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

        )

        .withFaceLandmarks()

        .withFaceDescriptor();


    if (!detection) {

      setStatus(
        "Registered face not detected. Please register the face again.",
        "error"
      );

      return;

    }


    registeredDescriptor =
      detection.descriptor;


    registeredFaceLoaded =
      true;


    setStatus(
      "Registered face loaded. Ready for verification.",
      "success"
    );


    captureBtn.disabled =
      false;


    sendRegisteredFaceReady();

  }
  catch (error) {

    console.error(
      "Registered face processing error:",
      error
    );


    setStatus(
      "Unable to process registered face.",
      "error"
    );

  }

}


/* =========================================================
   LOAD FACE API MODELS
========================================================= */

async function loadModels() {

  try {

    setStatus(
      "Loading face recognition models...",
      "info"
    );


    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";


    await faceapi.nets
      .tinyFaceDetector
      .loadFromUri(
        MODEL_URL
      );


    await faceapi.nets
      .faceLandmark68Net
      .loadFromUri(
        MODEL_URL
      );


    await faceapi.nets
      .faceRecognitionNet
      .loadFromUri(
        MODEL_URL
      );


    faceAIReady =
      true;


    console.log(
      "Face API models loaded."
    );


    /*
     * Send connection messages if parent
     * is already connected.
     */

    if (
      parentWindow ||
      window.opener
    ) {

      sendCameraConnected();

      sendCameraReady();

    }


    if (isRegistrationMode) {

      captureBtn.disabled =
        false;


      setStatus(
        "Camera ready. Face cameraમાં રાખો અને Capture Photo દબાવો.",
        "success"
      );

    }
    else {

      if (
        registeredFaceLoaded
      ) {

        captureBtn.disabled =
          false;

      }
      else {

        captureBtn.disabled =
          true;

        setStatus(
          "Face recognition ready. Registered face loading...",
          "info"
        );

      }

    }

  }
  catch (error) {

    console.error(
      "Model loading error:",
      error
    );


    setStatus(
      "Face model loading failed. Please refresh.",
      "error"
    );

  }

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  try {

    setStatus(
      "Requesting camera permission...",
      "info"
    );


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }

          },

          audio: false

        });


    video.srcObject =
      cameraStream;


    await video.play();


    setStatus(
      "Camera active. Face cameraમાં રાખો.",
      "success"
    );

  }
  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    setStatus(
      "Camera permission denied or camera unavailable.",
      "error"
    );

  }

}


/* =========================================================
   REGISTRATION PHOTO CAPTURE
========================================================= */

async function captureRegistrationPhoto() {

  if (!faceAIReady) {

    setStatus(
      "Face recognition is not ready.",
      "error"
    );

    return;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    setStatus(
      "Camera video is not ready.",
      "error"
    );

    return;

  }


  captureBtn.disabled =
    true;


  try {

    setStatus(
      "Face detect થઈ રહ્યો છે...",
      "info"
    );


    const detection =
      await faceapi

        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

        );


    /*
     * NO FACE
     */

    if (
      !detection ||
      detection.length === 0
    ) {

      setStatus(
        "❌ Face detect થયો નથી. Camera તરફ સીધું જુઓ.",
        "error"
      );


      captureBtn.disabled =
        false;


      return;

    }


    /*
     * MULTIPLE FACES
     */

    if (
      detection.length > 1
    ) {

      setStatus(
        "❌ Multiple faces detected. માત્ર એક trainee cameraમાં હોવો જોઈએ.",
        "error"
      );


      captureBtn.disabled =
        false;


      return;

    }


    /*
     * CREATE PHOTO
     */

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext(
        "2d"
      );


    /*
     * Mirror image
     */

    ctx.translate(
      canvas.width,
      0
    );


    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    capturedImageData =
      canvas.toDataURL(
        "image/jpeg",
        0.90
      );


    /*
     * Show preview
     */

    photoPreview.src =
      capturedImageData;


    photoPreview.style.display =
      "block";


    videoContainer.style.display =
      "none";


    captureBtn.style.display =
      "none";


    usePhotoBtn.style.display =
      "block";


    retakeBtn.style.display =
      "block";


    setStatus(
      "✅ Photo captured. Photo યોગ્ય હોય તો Use Photo દબાવો.",
      "success"
    );

  }
  catch (error) {

    console.error(
      "Registration capture error:",
      error
    );


    setStatus(
      "Photo capture failed. ફરી પ્રયાસ કરો.",
      "error"
    );


    captureBtn.disabled =
      false;

  }

}


/* =========================================================
   USE PHOTO
   IMPORTANT FIX
========================================================= */

function usePhoto() {

  if (!capturedImageData) {

    setStatus(
      "Photo ઉપલબ્ધ નથી.",
      "error"
    );

    return;

  }


  /*
   * Make absolutely sure opener is available.
   */

  try {

    if (
      !parentWindow &&
      window.opener &&
      !window.opener.closed
    ) {

      parentWindow =
        window.opener;

      console.log(
        "Using window.opener as parent."
      );

    }

  }
  catch (error) {

    console.log(
      "Unable to access window.opener."
    );

  }


  setStatus(
    "Photo Face Registration page પર મોકલી રહ્યા છીએ...",
    "info"
  );


  const message = {

    type:
      "ITI_VALOD_FACE_CAPTURE",

    trainee:
      selectedTrainee,

    traineeId:
      selectedTraineeId,

    image:
      capturedImageData,

    mode:
      "registration",

    faceVerified:
      false,

    verified:
      false

  };


  /*
   * Send to parent.
   */

  const sent =
    sendToParent(
      message
    );


  if (!sent) {

    setStatus(
      "❌ Face Registration page સાથે connection નથી. Camera ફરીથી ખોલો.",
      "error"
    );

    return;

  }


  /*
   * Give message enough time to reach
   * Face Registration page before closing.
   */

  setStatus(
    "✅ Photo Face Registration page પર મોકલાઈ રહી છે...",
    "success"
  );


  setTimeout(
    function() {

      stopCamera();


      try {

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.close();

        }

      }
      catch (error) {

        console.log(
          "Window close unavailable."
        );

      }

    },
    1200
  );

}


/* =========================================================
   RETAKE PHOTO
========================================================= */

function retakePhoto() {

  capturedImageData =
    "";


  photoPreview.src =
    "";


  photoPreview.style.display =
    "none";


  videoContainer.style.display =
    "block";


  captureBtn.style.display =
    "block";


  usePhotoBtn.style.display =
    "none";


  retakeBtn.style.display =
    "none";


  captureBtn.disabled =
    !faceAIReady;


  setStatus(
    "ફરીથી face cameraમાં રાખો અને Capture Photo દબાવો.",
    "info"
  );

}


/* =========================================================
   VERIFICATION
========================================================= */

async function verifyFace() {

  if (
    verificationInProgress
  ) {

    return;

  }


  if (!faceAIReady) {

    setStatus(
      "Face recognition is not ready.",
      "error"
    );

    return;

  }


  if (
    !registeredFaceLoaded ||
    !registeredDescriptor
  ) {

    setStatus(
      "Registered face is not ready.",
      "error"
    );

    return;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    setStatus(
      "Camera video is not ready.",
      "error"
    );

    return;

  }


  verificationInProgress =
    true;


  captureBtn.disabled =
    true;


  try {

    setStatus(
      "Detecting face...",
      "info"
    );


    const detection =
      await faceapi

        .detectAllFaces(

          video,

          new faceapi
            .TinyFaceDetectorOptions({

              inputSize: 320,

              scoreThreshold: 0.5

            })

        )

        .withFaceLandmarks()

        .withFaceDescriptors();


    /*
     * NO FACE
     */

    if (
      !detection ||
      detection.length === 0
    ) {

      setStatus(
        "Face not detected. Look directly at camera.",
        "error"
      );

      return;

    }


    /*
     * MULTIPLE FACES
     */

    if (
      detection.length > 1
    ) {

      setStatus(
        "Multiple faces detected. Only one trainee should be visible.",
        "error"
      );

      return;

    }


    const face =
      detection[0];


    /*
     * FACE DISTANCE
     */

    const distance =
      faceapi.euclideanDistance(

        registeredDescriptor,

        face.descriptor

      );


    distanceBox.textContent =
      "Face distance: " +
      distance.toFixed(3);


    console.log(
      "Face distance:",
      distance
    );


    const verified =
      distance <=
      FACE_DISTANCE_THRESHOLD;


    /*
     * CREATE VERIFICATION IMAGE
     */

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.translate(
      canvas.width,
      0
    );


    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(

      video,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const imageData =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );


    /*
     * NOT MATCHED
     */

    if (!verified) {

      setStatus(
        "Face does not match registered trainee.",
        "error"
      );


      sendToParent({

        type:
          "ITI_VALOD_FACE_VERIFIED",

        trainee:
          selectedTrainee,

        traineeId:
          selectedTraineeId,

        verified:
          false,

        faceVerified:
          false,

        distance:
          distance

      });


      return;

    }


    /*
     * VERIFIED
     */

    setStatus(
      "Face verified successfully.",
      "success"
    );


    sendToParent({

      type:
        "ITI_VALOD_FACE_CAPTURE",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      image:
        imageData,

      faceVerified:
        true,

      verified:
        true,

      distance:
        distance,

      mode:
        "verification"

    });


    sendToParent({

      type:
        "ITI_VALOD_FACE_VERIFIED",

      trainee:
        selectedTrainee,

      traineeId:
        selectedTraineeId,

      faceVerified:
        true,

      verified:
        true,

      distance:
        distance

    });

  }
  catch (error) {

    console.error(
      "Face verification error:",
      error
    );


    setStatus(
      "Face verification failed. Please try again.",
      "error"
    );

  }
  finally {

    verificationInProgress =
      false;


    captureBtn.disabled =
      !registeredFaceLoaded;

  }

}


/* =========================================================
   MAIN BUTTON
========================================================= */

captureBtn.addEventListener(
  "click",
  function() {

    if (
      isRegistrationMode
    ) {

      captureRegistrationPhoto();

    }
    else {

      verifyFace();

    }

  }
);


/* =========================================================
   USE PHOTO BUTTON
========================================================= */

usePhotoBtn.addEventListener(
  "click",
  function() {

    usePhoto();

  }
);


/* =========================================================
   RETAKE BUTTON
========================================================= */

retakeBtn.addEventListener(
  "click",
  function() {

    retakePhoto();

  }
);


/* =========================================================
   CLOSE CAMERA
========================================================= */

closeBtn.addEventListener(
  "click",
  function() {

    stopCamera();


    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.close();

      }

    }
    catch (error) {

      console.log(
        "Window close unavailable."
      );

    }

  }
);


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  video.srcObject =
    null;

}


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);


/* =========================================================
   VIDEO READY
========================================================= */

video.addEventListener(
  "loadedmetadata",
  function() {

    overlay.width =
      video.videoWidth;


    overlay.height =
      video.videoHeight;

  }
);


/* =========================================================
   START EVERYTHING
========================================================= */

(async function init() {

  try {

    setStatus(
      "Connecting to ITI VALOD Attendance...",
      "info"
    );


    /*
     * If opened by Face Registration page,
     * immediately remember opener.
     */

    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        parentWindow =
          window.opener;

        console.log(
          "Opener detected."
        );

      }

    }
    catch (error) {

      console.log(
        "Opener detection failed."
      );

    }


    await startCamera();


    await loadModels();


  }
  catch (error) {

    console.error(
      "Camera initialization error:",
      error
    );


    setStatus(
      "Camera initialization failed.",
      "error"
    );

  }

})();


</script>
